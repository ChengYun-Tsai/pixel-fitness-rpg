<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pixel Fitness">
<meta name="theme-color" content="#1a1c2c">
<title>Pixel Fitness RPG｜像素健身冒險</title>
<!-- App 圖示（相對路徑：部署在 GitHub Pages 子目錄 /pixel-fitness-rpg/ 也能正確載入） -->
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<!-- 像素英文字體（只用於數字與英文標題；沒有網路時會自動改用系統字體，不影響功能） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Pixel Fitness RPG — 樣式
   色票：Sweetie-16（復古 16-bit 風格）
   ========================================================= */
:root{
  --bg:#1a1c2c; --bg2:#232741; --panel:#333c57; --ink:#f4f4f4; --muted:#94b0c2; --dim:#566c86;
  --red:#b13e53; --orange:#ef7d57; --yellow:#ffcd75; --lime:#a7f070; --green:#38b764; --teal:#257179;
  --navy:#29366f; --blue:#3b5dc9; --sky:#41a6f6; --cyan:#73eff7; --purple:#5d275d; --black:#0d0e17;
  --pixel:"Press Start 2P", ui-monospace, monospace;
  --tab-h:66px; --timer-h:0px;
  --safe-b:env(safe-area-inset-bottom, 0px); --safe-t:env(safe-area-inset-top, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  background-image:
    linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
  background-size:16px 16px;
  color:var(--ink);
  font-family:-apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  font-size:16px; line-height:1.55; -webkit-text-size-adjust:100%;
  min-height:100dvh;
}
body.timer-on{--timer-h:118px}
a{color:var(--cyan)}
h1,h2,h3{margin:0 0 6px;line-height:1.3}
h2{font-size:19px} h3{font-size:16px}
p{margin:6px 0}
.px{font-family:var(--pixel);letter-spacing:.5px}
.muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:13px} .tiny{font-size:11px}
.yellow{color:var(--yellow)} .lime{color:var(--lime)} .red{color:#ff7a8f} .cyan{color:var(--cyan)}
.row{display:flex;align-items:center;gap:8px}
.row.wrap{flex-wrap:wrap} .between{justify-content:space-between} .grow{flex:1;min-width:0}
.center{text-align:center}
.hidden{display:none!important}
.mt{margin-top:10px} .mb{margin-bottom:10px}

/* ---------- 頂部列 ---------- */
.topbar{
  position:sticky;top:0;z-index:30;
  padding:calc(8px + var(--safe-t)) 12px 8px;
  background:var(--black);border-bottom:3px solid var(--panel);
  display:flex;align-items:center;gap:10px;
}
.topbar .logo{font-family:var(--pixel);font-size:10px;color:var(--yellow);line-height:1.5;flex:1}
.topbar .logo span{color:var(--cyan)}
.chip-px{font-family:var(--pixel);font-size:10px;padding:6px 8px;background:var(--bg2);border:2px solid var(--panel);white-space:nowrap}
.icon-btn{background:var(--bg2);border:2px solid var(--panel);color:var(--ink);font-size:18px;width:40px;height:36px;border-radius:0;cursor:pointer}

/* ---------- 主內容 ---------- */
main{max-width:600px;margin:0 auto;padding:12px 12px calc(var(--tab-h) + var(--timer-h) + var(--safe-b) + 24px)}

/* ---------- 像素框 ---------- */
.box{
  background:var(--bg2);border:3px solid var(--ink);
  box-shadow:0 0 0 3px var(--black), 5px 5px 0 3px var(--black);
  padding:14px;margin:14px 3px 18px;position:relative;
}
.box.alt{border-color:var(--sky)} .box.warn{border-color:var(--orange)} .box.good{border-color:var(--lime)}
.box.gold{border-color:var(--yellow)} .box.danger{border-color:var(--red)}
.box-title{
  position:absolute;top:-14px;left:10px;background:var(--black);padding:3px 8px;
  font-family:var(--pixel);font-size:9px;color:var(--yellow);border:2px solid currentColor;
}
.box-title + *{margin-top:4px}

/* ---------- 按鈕 ---------- */
button{font:inherit;color:inherit}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:46px;padding:10px 14px;cursor:pointer;
  background:var(--blue);color:#fff;font-weight:700;font-size:15px;
  border:3px solid var(--black);border-radius:0;
  box-shadow:inset -3px -3px 0 rgba(0,0,0,.35), inset 3px 3px 0 rgba(255,255,255,.22);
  user-select:none;-webkit-user-select:none;
}
.btn:active{transform:translate(2px,2px);box-shadow:inset 3px 3px 0 rgba(0,0,0,.35)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{display:flex;width:100%}
.btn.green{background:var(--green)} .btn.red{background:var(--red)} .btn.orange{background:var(--orange);color:var(--black)}
.btn.yellow{background:var(--yellow);color:var(--black)} .btn.ghost{background:var(--panel)} .btn.dark{background:var(--black)}
.btn.sm{min-height:38px;padding:6px 10px;font-size:14px}
.btn.big{min-height:58px;font-size:18px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row > .btn{flex:1 1 auto}

/* ---------- 底部導覽 ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--black);border-top:3px solid var(--panel);
  display:flex;padding:4px 4px calc(4px + var(--safe-b));
}
.tabbar button{
  flex:1;background:none;border:0;cursor:pointer;padding:6px 0 4px;min-height:56px;
  display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--dim);
}
.tabbar button .lbl{font-size:12px;font-weight:700}
.tabbar button.on{color:var(--yellow)}
.tabbar button.on .sprite{filter:drop-shadow(0 0 0 var(--yellow))}

/* ---------- 進度條 ---------- */
.bar{height:16px;background:var(--black);border:2px solid var(--ink);position:relative;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--lime);
  background-image:repeating-linear-gradient(90deg, transparent 0 6px, rgba(0,0,0,.18) 6px 8px)}
.bar.exp > i{background-color:var(--sky)} .bar.gold > i{background-color:var(--yellow)} .bar.hp > i{background-color:var(--red)}
.bar.thin{height:10px}

/* ---------- 標籤 ---------- */
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 7px;background:var(--panel);border:2px solid var(--black);margin:2px 4px 2px 0}
.tag.warn{background:var(--orange);color:var(--black)} .tag.ok{background:var(--green)} .tag.skip{background:var(--dim)}
.tag.info{background:var(--navy)} .tag.pending{background:var(--purple);color:var(--yellow)}

/* ---------- 首頁 ---------- */
.hero-card{display:flex;gap:14px;align-items:center}
.hero-stage{background:linear-gradient(#29366f 0 60%, #257179 60% 100%);border:3px solid var(--black);padding:8px;display:flex;align-items:flex-end;justify-content:center;min-width:104px;min-height:112px}
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.week-cell{background:var(--black);border:2px solid var(--panel);padding:6px 2px;text-align:center;font-size:12px;min-height:66px}
.week-cell .wd{font-weight:700;color:var(--muted)}
.week-cell .pl{font-size:11px;margin-top:2px}
.week-cell.today{border-color:var(--yellow)}
.week-cell.done{background:#1d3b2c;border-color:var(--green)}
.week-cell.part{background:#3d3420;border-color:var(--yellow)}
.week-cell .ck{font-family:var(--pixel);font-size:10px;color:var(--lime);margin-top:3px}
.stat-tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{background:var(--black);border:2px solid var(--panel);padding:8px}
.tile .v{font-family:var(--pixel);font-size:14px;color:var(--yellow);margin-top:4px}
.tile .k{font-size:12px;color:var(--muted)}

/* ---------- 分段切換 ---------- */
.seg{display:flex;gap:0;border:3px solid var(--black);margin:4px 3px 8px;overflow-x:auto}
.seg button{flex:1;min-height:44px;background:var(--panel);border:0;border-right:2px solid var(--black);cursor:pointer;font-weight:700;font-size:14px;padding:6px 8px;white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--yellow);color:var(--black)}

/* ---------- 課表與動作卡 ---------- */
.ex-card{background:var(--bg2);border:3px solid var(--muted);box-shadow:0 0 0 3px var(--black),4px 4px 0 3px var(--black);margin:14px 3px 18px;padding:12px}
.ex-card.current{border-color:var(--yellow)}
.ex-card.done{border-color:var(--green)}
.ex-card.skipped{border-color:var(--dim);opacity:.85}
.ex-card.swapped{border-color:var(--cyan)}
.ex-card.flagged{border-color:var(--red)}
.gear-bar{padding:10px 12px;margin-top:16px}
.variant-pick{background:var(--black);border:2px solid var(--cyan);padding:8px;margin:10px 0 4px;display:flex;flex-direction:column;gap:6px}
.variant-pick .lbl{font-size:12px;font-weight:800;color:var(--muted)}
.vbtn{min-height:44px;text-align:left;padding:8px 10px;background:var(--panel);border:2px solid var(--black);color:var(--ink);font-weight:700;font-size:14px;cursor:pointer}
.vbtn.on{background:var(--cyan);color:var(--black)}
.ex-head{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.ex-num{font-family:var(--pixel);font-size:11px;background:var(--black);color:var(--yellow);padding:6px;min-width:34px;text-align:center}
.ex-name{font-weight:800;font-size:17px;line-height:1.35}
.ex-meta{display:flex;flex-wrap:wrap;gap:2px;margin-top:4px}
.presc{font-weight:800;color:var(--yellow);font-size:15px;margin-top:6px}
.info{background:var(--black);border-left:4px solid var(--sky);padding:10px;margin-top:10px;font-size:14.5px}
.info.alt{border-left-color:var(--cyan)} .info.warn{border-left-color:var(--orange)} .info.pend{border-left-color:var(--purple)}
.info .lbl{font-weight:800;color:var(--muted);font-size:12px;display:block;margin-bottom:2px}
.toggle-link{background:none;border:0;color:var(--cyan);font-weight:700;padding:8px 0;cursor:pointer;font-size:14px}
.last-rec{background:#1c2236;border:2px dashed var(--dim);padding:8px;margin-top:10px;font-size:14px}
.last-rec b{color:var(--cyan)}
.hint-up{background:#22381f;border:2px solid var(--green);padding:8px;margin-top:8px;font-size:13.5px}

/* 每組輸入 */
.set-row{display:flex;align-items:center;gap:8px;padding:8px;margin-top:6px;background:var(--black);border:2px solid var(--panel);cursor:pointer}
.set-row.done{border-color:var(--green)}
.set-row .sl{font-weight:800;min-width:56px}
.set-row .sv{flex:1;font-size:14px;color:var(--muted)}
.set-row.done .sv{color:var(--ink)}
.set-edit{background:var(--black);border:3px solid var(--yellow);padding:10px;margin-top:8px}
.set-edit .sl{font-weight:800;color:var(--yellow);margin-bottom:6px;display:flex;justify-content:space-between}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fgrid .full{grid-column:1 / -1}
label.f{display:flex;flex-direction:column;font-size:12px;color:var(--muted);font-weight:700;gap:3px}
input,select,textarea{
  font:inherit;font-size:16px;color:var(--ink);background:#10121d;border:2px solid var(--dim);
  padding:10px;border-radius:0;width:100%;min-height:46px;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--yellow)}
input[type=range]{padding:0;min-height:36px;accent-color:var(--yellow)}
input[type=checkbox]{width:24px;height:24px;min-height:0;accent-color:var(--lime)}
input.big-num{font-size:24px;font-weight:800;text-align:center;font-family:var(--pixel);font-size:18px}

.card-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.card-actions .btn{flex:1 1 30%}

/* 身體狀況 */
.pain-scale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.pain-val{font-family:var(--pixel);font-size:22px;text-align:center;margin:4px 0}
.alert{padding:10px;border:3px solid var(--black);margin-top:8px;font-weight:700;font-size:14.5px}
.alert.ok{background:#1d3b2c;border-color:var(--green)}
.alert.mid{background:#3d3420;border-color:var(--yellow)}
.alert.stop{background:#4a1d27;border-color:var(--red)}

/* ---------- 計時器 ---------- */
.timer{
  position:fixed;left:0;right:0;z-index:35;
  bottom:calc(var(--tab-h) + var(--safe-b));
  background:var(--black);border-top:3px solid var(--yellow);
  padding:8px 12px;
}
.timer .inner{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:10px}
.timer .t-num{font-family:var(--pixel);font-size:30px;color:var(--yellow);min-width:132px;text-align:center}
.timer.work .t-num{color:var(--lime)} .timer.work{border-top-color:var(--lime)}
.timer .t-lbl{font-size:13px;font-weight:700;color:var(--muted);line-height:1.3}
.timer .t-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px}
.timer .t-btns .btn{min-height:40px;padding:4px;font-size:13px}
.timer .bar{margin-top:4px}

/* ---------- 訓練中頂部 ---------- */
.sess-head{position:relative}
.elapsed{font-family:var(--pixel);font-size:16px;color:var(--lime)}
.paused-veil{position:fixed;inset:0;background:rgba(13,14,23,.92);z-index:60;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:20px;text-align:center}
.paused-veil .px{font-size:22px;color:var(--yellow)}

/* ---------- Modal ---------- */
.modal-back{position:fixed;inset:0;background:rgba(13,14,23,.8);z-index:80;display:flex;align-items:flex-end;justify-content:center}
.modal{
  background:var(--bg2);border:3px solid var(--ink);box-shadow:0 0 0 3px var(--black);
  width:100%;max-width:600px;max-height:90dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:16px 16px calc(16px + var(--safe-b));
}
@media (min-width:640px){ .modal-back{align-items:center} .modal{max-height:86vh} }
.modal-title{font-family:var(--pixel);font-size:12px;color:var(--yellow);margin-bottom:12px;line-height:1.6}
.modal .close-x{float:right;background:var(--panel);border:2px solid var(--black);width:40px;height:40px;font-size:18px;cursor:pointer}

/* ---------- Toast ---------- */
#toastRoot{position:fixed;left:0;right:0;top:calc(64px + var(--safe-t));z-index:100;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:var(--black);border:3px solid var(--yellow);padding:10px 14px;font-weight:700;max-width:92%;font-size:14.5px;animation:pop .2s steps(3)}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}

/* ---------- 角色 ---------- */
.char-top{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.stat-line{display:grid;grid-template-columns:52px 1fr 54px;gap:8px;align-items:center;margin:8px 0}
.stat-line .k{font-family:var(--pixel);font-size:11px}
.stat-line .v{font-family:var(--pixel);font-size:11px;text-align:right;color:var(--yellow)}
.slot-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.slot{background:var(--black);border:2px solid var(--panel);padding:8px;cursor:pointer;display:flex;gap:8px;align-items:center;min-height:64px;text-align:left}
.slot .sn{font-size:11px;color:var(--muted);font-weight:700}
.slot .in{font-weight:800;font-size:14px}
.item-list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:10px;align-items:center;background:var(--black);border:2px solid var(--panel);padding:10px}
.item.eq{border-color:var(--yellow)}
.item.locked{opacity:.6}
.swatch{width:28px;height:28px;border:3px solid var(--black);box-shadow:0 0 0 2px var(--ink);flex:none}

/* ---------- 地圖 ---------- */
.world svg{width:100%;height:auto;display:block;border:3px solid var(--black)}
.region{border-color:var(--muted)}
.region.locked{opacity:.7;filter:grayscale(.7)}
.stage-list{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.stage{flex:1 1 30%;background:var(--black);border:2px solid var(--panel);padding:6px;text-align:center;font-size:12px;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.stage.clear{border-color:var(--green)}
.stage.boss{border-color:var(--red);flex-basis:100%;flex-direction:row;gap:10px;justify-content:flex-start;text-align:left;min-height:0}
.stage.boss.clear{border-color:var(--yellow)}
.silh{filter:brightness(0) opacity(.55)}
.dex-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dex-cell{background:var(--black);border:2px solid var(--panel);padding:6px;text-align:center;font-size:12px;min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.battle{background:linear-gradient(#29366f 0 55%, #333c57 55%);border:3px solid var(--black);padding:14px;display:flex;justify-content:space-between;align-items:flex-end;min-height:150px}
.shake{animation:shake .35s steps(4)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.hop{animation:hop .35s steps(3)}
@keyframes hop{50%{transform:translate(14px,-8px)}}

/* ---------- 成就 ---------- */
.ach{display:flex;gap:10px;align-items:center;background:var(--black);border:2px solid var(--panel);padding:10px;margin-bottom:8px}
.ach.on{border-color:var(--yellow)}
.ach .ic{font-size:26px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--bg2);border:2px solid var(--panel);flex:none}
.ach:not(.on) .ic{filter:grayscale(1) opacity(.5)}

/* ---------- 統計 / 歷史 ---------- */
.chart{width:100%;height:auto;display:block;background:var(--black);border:2px solid var(--panel)}
.hist-item{background:var(--black);border:2px solid var(--panel);padding:10px;margin-bottom:8px;cursor:pointer}
.hist-item:active{border-color:var(--yellow)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th,table.t td{border:1px solid var(--panel);padding:6px;text-align:left;vertical-align:top}
table.t th{background:var(--black);color:var(--muted);font-size:12px}
.scroll-x{overflow-x:auto}
ul.rules{margin:4px 0;padding-left:20px} ul.rules li{margin:4px 0}
details summary{cursor:pointer;font-weight:800;padding:6px 0;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"▶ ";color:var(--yellow);font-size:12px}
details[open] summary::before{content:"▼ "}
.levelup{font-family:var(--pixel);color:var(--yellow);font-size:16px;text-align:center;padding:10px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{color:var(--orange)}}
.sprite{image-rendering:pixelated;display:block}
</style>
</head>
<body>
<noscript><p style="padding:20px">這個遊戲需要開啟 JavaScript 才能使用。</p></noscript>

<header class="topbar">
  <div class="logo">PIXEL <span>FITNESS</span> RPG</div>
  <div class="chip-px" id="tbLevel">LV 1</div>
  <div class="chip-px yellow" id="tbGold">G 0</div>
  <button class="icon-btn" data-act="openSettings" aria-label="設定與備份">⚙</button>
</header>

<main id="view"></main>

<div class="timer hidden" id="timerBar"></div>

<nav class="tabbar" id="tabbar">
  <button data-act="tab" data-tab="home"><span data-icon="home"></span><span class="lbl">首頁</span></button>
  <button data-act="tab" data-tab="workout"><span data-icon="sword"></span><span class="lbl">訓練</span></button>
  <button data-act="tab" data-tab="character"><span data-icon="hero"></span><span class="lbl">角色</span></button>
  <button data-act="tab" data-tab="map"><span data-icon="map"></span><span class="lbl">地圖</span></button>
  <button data-act="tab" data-tab="achievements"><span data-icon="trophy"></span><span class="lbl">成就</span></button>
</nav>

<div id="modalRoot"></div>
<div id="toastRoot"></div>
<input type="file" id="importFile" accept="application/json,.json" class="hidden">

<script>
'use strict';
/* =====================================================================
   Pixel Fitness RPG
   ---------------------------------------------------------------------
   程式結構：
   1. 課表資料（唯一正式訓練資料來源：新版《居家健身課表.txt》）
   2. 遊戲內容（裝備、地圖、怪物、成就）

const KEYS = { training: 'pfr.training.v1', game: 'pfr.game.v1', settings: 'pfr.settings.v1' };

function defaultTraining() { return { version: 1, sessions: [], active: null }; }
function defaultGame() {
  return {
    version: 1, name: '冒險者', exp: 0, gold: 0,
    awarded: {}, dayFlags: {}, weekGoals: {}, checkAwarded: {},
    achievements: {}, bosses: {}, inventory: [],
    equipped: { weapon: 'w_wood', helmet: 'h_band', armor: 'a_cloth', gloves: 'g_cloth', boots: 'b_straw', accessory: 'acc_none' },
    createdAt: Date.now()
  };
}
function defaultSettings() { return { version: 1, sound: true, vibrate: true, gear: { bandLb: GEAR_DEFAULT.bandLb, bottleKg: GEAR_DEFAULT.bottleKg } }; }

function loadJSON(key, fallbackFn) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return fallbackFn();
    return Object.assign(fallbackFn(), JSON.parse(raw));
  } catch (err) {
    console.warn('讀取失敗', key, err);
    return fallbackFn();
  }
}
function saveJSON(key, data) {
  try { localStorage.setItem(key, JSON.stringify(data)); return true; }
  catch (err) { toast('⚠ 儲存失敗：瀏覽器空間不足或被禁止。請先匯出備份。'); return false; }
}

let training = loadJSON(KEYS.training, defaultTraining);
let game = loadJSON(KEYS.game, defaultGame);
let settings = loadJSON(KEYS.settings, defaultSettings);
if (!settings.gear || typeof settings.gear !== 'object') settings.gear = defaultSettings().gear;
game.equipped = Object.assign(defaultGame().equipped, game.equipped || {});

function saveTraining() {
  if (training.active) training.active.lastTouch = Date.now();
  saveJSON(KEYS.training, training);
}
function saveGame() { saveJSON(KEYS.game, game); }
function saveSettings() { saveJSON(KEYS.settings, settings); }

/* =====================================================================
   4. 工具函式
   ===================================================================== */
const pad = n => String(n).padStart(2, '0');
const WEEKDAY_ZH = ['一', '二', '三', '四', '五', '六', '日'];

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function ymd(d = new Date()) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function parseYmd(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function weekdayIdx(s) { return (parseYmd(s).getDay() + 6) % 7; } // 0 = 週一
function weekKey(s) { const d = parseYmd(s); d.setDate(d.getDate() - weekdayIdx(s)); return ymd(d); }
function addDays(s, n) { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); }
function fmtDate(s) { const d = parseYmd(s); return `${d.getMonth() + 1}/${d.getDate()}（${WEEKDAY_ZH[weekdayIdx(s)]}）`; }
function fmtDur(ms) {
  const t = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
  return h ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}
function fmtMin(ms) { return `${Math.max(0, Math.round(ms / 60000))} 分鐘`; }
/** 空字串視為「沒有資料」（例如徒手訓練不填重量） */
function num(v) { if (v === '' || v === null || v === undefined) return null; const n = Number(v); return Number.isFinite(n) ? n : null; }
function fmtNum(n) { return (Math.round(n * 10) / 10).toLocaleString('zh-TW'); }

/* =====================================================================
   5. 訓練資料查詢與統計
   ===================================================================== */
function completedSessions() {
  return training.sessions.filter(s => s.status === 'completed')
    .sort((a, b) => (a.date === b.date ? a.startedAt - b.startedAt : a.date < b.date ? -1 : 1));
}
function doneSets(e) { return e.sets.filter(x => x.done); }

/** 動作結果（四種）：
 *  full    完整完成：規定組數（不含額外組）全部完成
 *  safe    安全處理：因疼痛／手麻而跳過
 *  partial 部分完成：有完成組數，但沒有做完規定組數
 *  skip    一般跳過：因時間、器材或其他原因跳過
 *  none    還沒做 */
/** 規定要做的組：不含額外組，也不含「本次減量」拿掉的組（dropped） */
function isTargetSet(x) { return !x.extra && !x.dropped; }
/** 這次還需要做的組（含額外組，不含減量的組） */
function isOpenSet(x) { return !x.done && !x.dropped; }
/** HIIT 是否已用「3 分鐘腿部訓練」完整替代（做 1 次、滿 3 分鐘） */
function isLightDone(e) {
  const def = EX[e.exerciseId]; if (!def || !def.alternatives.some(a => a.light)) return false;
  return doneSets(e).some(x => { const v = variantDef(def, x.alt); return v.light && num(x.seconds) !== null && num(x.seconds) >= v.duration; });
}
function exerciseOutcome(e) {
  if (e.status === 'skipped') return e.skipReason === 'pain' ? 'safe' : 'skip';
  if (isLightDone(e)) return 'full';   // 替代方案完成＝當天 HIIT 完成（只算一次，不和 HIIT 輪數重複）
  const target = e.sets.filter(isTargetSet);
  if (target.length && target.every(x => x.done)) return 'full';
  return doneSets(e).length ? 'partial' : 'none';
}
const OUTCOME_LABEL = { full: '完整完成', safe: '疼痛安全跳過', partial: '部分完成', skip: '其他跳過', none: '未做' };
/** 完整課表的條件：每個動作都是「完整完成」或「疼痛安全跳過」 */
function isComplete(e) { const o = exerciseOutcome(e); return o === 'full' || o === 'safe'; }
/** 有參與：完成至少一組，或疼痛安全跳過 */
function isParticipated(e) { const o = exerciseOutcome(e); return o === 'full' || o === 'safe' || o === 'partial'; }
/** 這次訓練有沒有實際內容（用來計算「有參與」的訓練次數） */
function sessionCounts(s) { return s.exercises.some(isParticipated); }
/** 這次訓練是不是完整完成課表 */
function sessionFull(s) { return s.exercises.length > 0 && s.exercises.every(isComplete); }

function sessionsInWeek(wk) { return completedSessions().filter(s => weekKey(s.date) === wk && sessionCounts(s)); }
/** 本週「有參與」的正式訓練日 */
function formalDaysDoneInWeek(wk) {
  return new Set(sessionsInWeek(wk).filter(s => s.kind === 'formal').map(s => s.dayId));
}
/** 本週「完整完成課表」的正式訓練日 */
function formalDaysFullInWeek(wk) {
  return new Set(sessionsInWeek(wk).filter(s => s.kind === 'formal' && sessionFull(s)).map(s => s.dayId));
}

/** 階段計時：扣掉暫停時間 */
function elapsedMs(s) {
  const end = s.endedAt || Date.now();
  const paused = (s.pausedMs || 0) + (s.pausedAt ? (end - s.pausedAt) : 0);
  return Math.max(0, end - s.startedAt - paused);
}

/** 一次訓練的摘要。訓練量只計算「有填重量」的組數（重量 × 次數）。 */
function summarize(s) {
  let exCount = 0, setCount = 0, volume = 0, weightedSets = 0;
  const outcomes = { full: 0, safe: 0, partial: 0, skip: 0, none: 0 };
  s.exercises.forEach(e => {
    outcomes[exerciseOutcome(e)]++;
    const ds = doneSets(e);
    if (ds.length) exCount++;
    setCount += ds.length;
    ds.forEach(x => {
      const w = num(x.weight), r = num(x.reps);
      if (w && w > 0 && r && r > 0) { volume += w * r; weightedSets++; }
    });
  });
  return { exCount, setCount, volume, weightedSets, durationMs: elapsedMs(s), total: s.exercises.length,
    outcomes, full: sessionFull(s) };
}

/** 把一個動作完成的組，依「實際做的版本」（原動作／替代動作）分組 */
function groupSetsByVariant(e) {
  const def = EX[e.exerciseId]; if (!def) return [];
  const groups = {};
  doneSets(e).forEach(x => {
    const v = variantDef(def, x.alt);
    (groups[v.moveKey] || (groups[v.moveKey] = { v, sets: [] })).sets.push(x);
  });
  return Object.values(groups);
}
/** 某個動作（moveKey）的歷史：每一組都依當時實際做的版本歸類，原動作與替代動作不會混在一起 */
function moveHistory(moveKey, excludeId) {
  const out = [];
  completedSessions().forEach(s => {
    if (s.id === excludeId) return;
    s.exercises.forEach(e => {
      groupSetsByVariant(e).forEach(g => { if (g.v.moveKey === moveKey) out.push({ session: s, entry: e, sets: g.sets, def: g.v }); });
    });
  });
  return out;
}
function lastRecord(moveKey, excludeId) { const h = moveHistory(moveKey, excludeId); return h.length ? h[h.length - 1] : null; }

/** 單次表現：最佳次數（或秒數）、最大重量 */
function bestOf(sets, type) {
  let best = null, maxW = null;
  sets.forEach(x => {
    const v = type === 'time' ? num(x.seconds) : num(x.reps);
    if (v !== null && (best === null || v > best)) best = v;
    const w = num(x.weight);
    if (w !== null && w > 0 && (maxW === null || w > maxW)) maxW = w;
  });
  return { best, maxW };
}

/** 進步紀錄：同一動作、同一單位才比較；第一次做不算進步 */
function computePRs() {
  const bests = {}; // moveKey -> {best, maxW}
  const prs = [];    // {sessionId, moveKey, kind, from, to}
  completedSessions().forEach(s => {
    s.exercises.forEach(e => groupSetsByVariant(e).forEach(({ v: def, sets: ds }) => {
      if (def.type === 'hiit' || def.light) return;
      const cur = bestOf(ds, def.type);
      const prev = bests[def.moveKey];
      if (prev) {
        if (cur.best !== null && prev.best !== null && cur.best > prev.best)
          prs.push({ sessionId: s.id, moveKey: def.moveKey, name: def.name, kind: def.type === 'time' ? '秒數' : '次數', from: prev.best, to: cur.best });
        else if (cur.maxW !== null && prev.maxW !== null && cur.maxW > prev.maxW)
          prs.push({ sessionId: s.id, moveKey: def.moveKey, name: def.name, kind: '重量', from: prev.maxW, to: cur.maxW });
        bests[def.moveKey] = {
          best: Math.max(prev.best ?? -1, cur.best ?? -1) < 0 ? null : Math.max(prev.best ?? -1, cur.best ?? -1),
          maxW: Math.max(prev.maxW ?? -1, cur.maxW ?? -1) < 0 ? null : Math.max(prev.maxW ?? -1, cur.maxW ?? -1)
        };
      } else {
        bests[def.moveKey] = cur;
      }
    }));
  });
  return prs;
}

/** 連續週數：每週至少練 1 次就算（休息日不會中斷） */
function weekStreak() {
  const weeks = new Set(completedSessions().filter(s => s.kind === 'formal' && sessionCounts(s)).map(s => weekKey(s.date)));
  let wk = weekKey(ymd());
  if (!weeks.has(wk)) wk = addDays(wk, -7); // 本週還沒練不算中斷
  let n = 0;
  while (weeks.has(wk)) { n++; wk = addDays(wk, -7); }
  return n;
}

/** 統計數字（成就、屬性、地圖共用） */
function buildContext() {
  const sessions = completedSessions().filter(sessionCounts);
  const formal = sessions.filter(s => s.kind === 'formal');
  const weeks = {};   // 只算「完整完成課表」的日子
  formal.filter(sessionFull).forEach(s => { (weeks[weekKey(s.date)] ||= new Set()).add(s.dayId); });
  let safeChoices = 0, upperSets = 0, lowerSets = 0, coreSets = 0;
  sessions.forEach(s => s.exercises.forEach(e => {
    const painAlt = e.painReports && e.painReports.length && doneSets(e).some(x => x.alt !== null && x.alt !== undefined);
    if (painAlt || (e.status === 'skipped' && e.skipReason === 'pain')) safeChoices++;
    // 每一組只依「實際做的動作」（原動作或替代動作）分類一次，不重複計算
    groupSetsByVariant(e).forEach(({ v, sets }) => {
      const n = sets.length;
      if (['chest', 'back', 'shoulders', 'arms'].includes(v.category)) upperSets += n;
      else if (v.category === 'legs') lowerSets += n;
      else if (v.category === 'core') coreSets += n;
      // cardio（HIIT 輪數、3 分鐘腿部訓練）、null 或其他未知分類：不計入任何肌群組數
    });
  }));
  return {
    formal: formal.length,
    formalFull: formal.filter(sessionFull).length,
    upper: formal.filter(s => s.dayId === 'd1' || s.dayId === 'd3').length,
    lower: formal.filter(s => s.dayId === 'd2' || s.dayId === 'd4').length,
    distinctDays: new Set(formal.map(s => s.dayId)).size,
    goalWeeks: Object.values(weeks).filter(set => set.size >= 4).length,
    checks: completedSessions().filter(s => s.nextDay).length,
    prCount: computePRs().length,
    safeChoices, upperSets, lowerSets, coreSets,
    level: levelInfo(game.exp).level,
    bosses: Object.keys(game.bosses).length
  };
}

/** 今日建議：照課表「週一、二、四、六，沒練到就隔天補」 */
function todaySuggestion() {
  const today = ymd(), wk = weekKey(today), wi = weekdayIdx(today);
  const done = formalDaysDoneInWeek(wk);
  const doneToday = completedSessions().some(s => s.date === today && s.kind === 'formal' && sessionCounts(s));
  if (doneToday) return { type: 'doneToday' };
  const due = FORMAL_DAYS.filter(d => d.weekday <= wi && !done.has(d.id));
  if (due.length) return { type: due[0].weekday === wi ? 'today' : 'makeup', day: due[0] };
  if (done.size >= 4) return { type: 'weekDone' };
  return { type: 'rest' };
}

/** 尚未做的隔天檢查（最近一次正式訓練，日期在今天之前、3 天內） */
function pendingNextDayCheck() {
  const today = ymd();
  const list = completedSessions().filter(s => s.kind === 'formal' && sessionCounts(s));
  const last = list[list.length - 1];
  if (!last || last.nextDay) return null;
  if (last.date >= today || last.date < addDays(today, -3)) return null;
  return last;
}
/** 最近一次隔天檢查變更糟，且之後還沒有再練 → 提醒「下次少一組」 */
function worseReminder() {
  const list = completedSessions().filter(s => s.kind === 'formal' && sessionCounts(s));
  const last = list[list.length - 1];
  return last && last.nextDay && last.nextDay.result === 'worse' ? last : null;
}

/* =====================================================================
   6. 獎勵系統
   ===================================================================== */
function expForLevel(L) { return 100 + (L - 1) * 50; } // 從 L 升到 L+1 需要的 EXP
function levelInfo(exp) {
  let L = 1, rem = exp;
  while (L < 99 && rem >= expForLevel(L)) { rem -= expForLevel(L); L++; }
  return { level: L, cur: rem, need: expForLevel(L), total: exp };
}

/** 發放一次訓練的獎勵（同一筆紀錄只發一次）。
 *  - 每個動作固定 EXP，不看重量、不看組數（多做組數不會多拿）
 *  - 因疼痛跳過的動作照樣給 EXP（不懲罰安全選擇）
 *  - 同一天只計一次正式訓練獎勵，避免重複刷 */
function awardSession(s) {
  if (game.awarded[s.id]) return null;
  const r = { exp: 0, gold: 0, lines: [] };
  const flags = game.dayFlags[s.date] || (game.dayFlags[s.date] = {});
  const sm = summarize(s);
  const complete = sm.outcomes.full + sm.outcomes.safe;   // 疼痛安全跳過 = 正向獎勵
  const partial = sm.outcomes.partial;
  const add = (rw, label, times = 1) => { if (!times) return; r.exp += rw.exp * times; r.gold += rw.gold * times; r.lines.push(`${label}：+${rw.exp * times} EXP、+${rw.gold * times} G`); };

  if (complete + partial === 0) { r.lines.push('這次沒有完成任何動作，沒有獎勵也沒有懲罰。'); }
  else if (s.kind === 'formal') {
    if (flags.formal) r.lines.push('同一天只計算一次正式訓練獎勵，好好休息吧。');
    else {
      flags.formal = true;
      add(REWARD.exercise, `完整完成 ${sm.outcomes.full}＋疼痛安全跳過 ${sm.outcomes.safe}`, complete);
      add(REWARD.exercisePartial, `部分完成 × ${partial}`, partial);
      if (sm.full) add(REWARD.formalComplete, '完整完成當日課表');
      else r.lines.push('有動作只完成部分組數或因其他原因跳過，這次不發「完整課表」獎勵（沒有懲罰）。');
      const wk = weekKey(s.date);
      if (!game.weekGoals[wk] && formalDaysFullInWeek(wk).size >= 4) {
        game.weekGoals[wk] = true;
        add(REWARD.weekGoal, '本週 4 練都完整完成');
      }
    }
  }
  game.exp += r.exp; game.gold += r.gold;
  game.awarded[s.id] = { exp: r.exp, gold: r.gold };
  return r;
}

function awardNextDayCheck(s) {
  if (game.checkAwarded[s.id]) return null;
  game.checkAwarded[s.id] = true;
  game.exp += REWARD.nextDayCheck.exp; game.gold += REWARD.nextDayCheck.gold;
  return REWARD.nextDayCheck;
}

/** 檢查新成就，回傳新解鎖的清單 */
function checkAchievements() {
  const ctx = buildContext();
  const unlocked = [];
  ACHIEVEMENTS.forEach(a => {
    if (game.achievements[a.id]) return;
    const [cur, goal] = a.prog(ctx);
    if (cur >= goal) {
      game.achievements[a.id] = Date.now();
      game.gold += a.gold;
      unlocked.push(a);
    }
  });
  // 解鎖成就可能讓等級變動 → 再檢查一次（等級類成就）
  if (unlocked.length) unlocked.push(...checkAchievements());
  return unlocked;
}

function isItemUnlocked(item) {
  const u = item.unlock;
  if (u.type === 'start') return true;
  if (u.type === 'level') return levelInfo(game.exp).level >= u.value;
  if (u.type === 'ach') return !!game.achievements[u.id];
  if (u.type === 'boss') return !!game.bosses[u.id];
  if (u.type === 'shop') return game.inventory.includes(item.id);
  return false;
}
function unlockText(item) {
  const u = item.unlock;
  if (u.type === 'level') return `Lv ${u.value} 解鎖`;
  if (u.type === 'ach') { const a = ACHIEVEMENTS.find(x => x.id === u.id); return `成就「${a ? a.name : u.id}」`; }
  if (u.type === 'boss') { const r = REGION[u.id]; return `擊敗 ${MONSTERS[r.boss.m].name}`; }
  if (u.type === 'shop') return `商店 ${u.price} G`;
  return '初始裝備';
}
function unlockedItemIds() { return ITEMS.filter(isItemUnlocked).map(i => i.id); }

/** 角色屬性（純遊戲數值，不代表真實體能或醫療測量） */
function characterStats() {
  const c = buildContext();
  const lv = levelInfo(game.exp).level;
  const base = {
    str: 5 + Math.floor(c.upperSets / 15) + Math.floor(lv / 2),
    vit: 5 + Math.floor(c.lowerSets / 15) + Math.floor(lv / 2),
    dex: 5 + Math.floor(c.coreSets / 10) + Math.floor(lv / 2),
    end: 5 + Math.floor(c.formal / 2) + Math.floor(lv / 2)   // 新版課表沒有恢復日：只依正式訓練次數與等級
  };
  const bonus = { str: 0, vit: 0, dex: 0, end: 0 };
  Object.values(game.equipped).forEach(id => { const it = ITEM[id]; if (it) Object.entries(it.stats).forEach(([k, v]) => bonus[k] += v); });
  return { base, bonus };
}

/** 地圖進度 */
function stageCleared(region, stage, ctx) { return ctx.level >= region.levelReq && ctx.formal >= stage.req; }
function bossReady(region, ctx) {
  return ctx.level >= region.levelReq && region.stages.every(st => stageCleared(region, st, ctx))
    && ctx.formal >= region.boss.req && ctx.level >= region.boss.levelReq;
}

/** 依訓練紀錄重新計算遊戲進度（重置後可選用） */
function rebuildGameFromHistory(keepName) {
  const name = game.name;
  game = defaultGame();
  if (keepName) game.name = name;
  completedSessions().forEach(s => { awardSession(s); if (s.nextDay) awardNextDayCheck(s); });
  checkAchievements();
  saveGame();
}

/* =====================================================================
   7. 像素圖形（全部用 SVG 方塊繪製，不需要外部素材）
   ===================================================================== */
function spriteSVG(rows, pal, px = 4, cls = '') {
  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  let rects = '';
  rows.forEach((row, y) => {
    let x = 0;
    while (x < row.length) {
      const c = row[x];
      if (c === '.' || !pal[c]) { x++; continue; }
      let run = 1;
      while (row[x + run] === c) run++;
      rects += `<rect x="${x}" y="${y}" width="${run}" height="1" fill="${pal[c]}"/>`;
      x += run;
    }
  });
  return `<svg class="sprite ${cls}" viewBox="0 0 ${w} ${h}" width="${w * px}" height="${h * px}" shape-rendering="crispEdges" aria-hidden="true">${rects}</svg>`;
}

const HERO_BASE = [
  '.....hhhhhh.....',
  '....hhhhhhhh....',
  '...hhhhhhhhhh...',
  '...hssssssssh...',
  '....sesssses....',
  '....ssssssss....',
  '.....ssmmss.....',
  '...aaaaaaaaaa...',
  '..gaaaaaaaaaag..',
  '..gaaaaaaaaaag..',
  '...bbbbbbbbbb...',
  '...llll..llll...',
  '...llll..llll...',
  '...ffff..ffff...',
  '..fffff..fffff..'
];
/** 武器疊在角色右手邊 */
function weaponOverlay(wtype) {
  const rows = HERO_BASE.map(() => '.'.repeat(16).split(''));
  const put = (x, y, c) => { if (rows[y]) rows[y][x] = c; };
  if (wtype === 'sword') { for (let y = 1; y <= 8; y++) put(14, y, 'w'); put(13, 9, 'k'); put(14, 9, 'k'); put(15, 9, 'k'); put(14, 10, 'k'); }
  else if (wtype === 'axe') { for (let y = 2; y <= 10; y++) put(14, y, 'k'); put(15, 2, 'w'); put(15, 3, 'w'); put(15, 4, 'w'); put(13, 2, 'w'); put(13, 3, 'w'); }
  else if (wtype === 'whip') { [[14, 9], [15, 8], [15, 7], [14, 6], [14, 5], [15, 4], [15, 3]].forEach(([x, y]) => put(x, y, 'w')); put(14, 10, 'k'); }
  return rows.map(r => r.join(''));
}
function mergeRows(base, top, under = false) {
  return base.map((row, y) => row.split('').map((c, x) => {
    const t = top[y] ? top[y][x] : '.';
    if (!t || t === '.') return c;
    return under ? (c === '.' ? t : c) : t;
  }).join(''));
}
function heroSVG(px = 6, equipped = game.equipped) {
  const it = slot => ITEM[equipped[slot]] || {};
  const pal = {
    h: it('helmet').color || '#5d275d', s: '#f6c08e', e: '#1a1c2c', m: '#b13e53',
    a: it('armor').color || '#3b5dc9', g: it('gloves').color || '#f4f4f4', b: '#333c57',
    l: '#29366f', f: it('boots').color || '#c2a36b', w: it('weapon').color || '#c28569', k: '#ef7d57',
    c: it('accessory').color || '#b13e53', x: it('accessory').color || '#ffcd75'
  };
  let rows = HERO_BASE.slice();
  const acc = it('accessory');
  if (acc.cape) {
    const cape = HERO_BASE.map((_, y) => (y >= 7 && y <= 12) ? '.c' + '.'.repeat(12) + 'c.' : '.'.repeat(16));
    rows = mergeRows(rows, cape, true);
  } else if (acc.color) {
    const badge = HERO_BASE.map((_, y) => y === 8 ? '......x.........' : '.'.repeat(16));
    rows = mergeRows(rows, badge);
  }
  if (it('weapon').wtype) rows = mergeRows(rows, weaponOverlay(it('weapon').wtype));
  return spriteSVG(rows, pal, px);
}

  beast: ['...oooooo...', '..oooooooo..', '..oeooooeo..', '..oooooooo..', '..oommmmoo..', 'oooooooooooo', 'oooooooooooo', 'oo.oooooo.oo', 'oo.oooooo.oo', '...oo..oo...', '...oo..oo...', '..ooo..ooo..'],
  boss: ['o..............o', 'oo............oo', '.oooooooooooooo.', '..oooooooooooo..', '..ooeooooooeoo..', '..oooooooooooo..', '...oommmmmmoo...', '.oooooooooooooo.', 'oooooooooooooooo', 'oo.oooooooooo.oo', 'o..oooooooooo..o', '...ooo....ooo...', '...ooo....ooo...', '..oooo....oooo..']
};

/* =====================================================================
   8. 計時器（組間休息、計時動作、HIIT 間歇）
   以結束時間戳記計算，切到背景回來也會正確。
   ===================================================================== */
// cue：這次倒數已經播過的秒數（例如 {3:true, 2:true}），開始新計時、切換 HIIT 階段、調整時間時清空
const timer = { on: false, mode: 'rest', label: '', endAt: 0, total: 0, pausedLeft: null, phases: null, phaseIdx: 0, onDone: null, cue: {} };

/* ---------- 提示音（Web Audio API） ----------
   柔和音色：sine 為主、疊一點點 triangle 泛音，像鬧鈴的「叮」，用 GainNode 做淡入淡出避免爆音。
   iOS Safari：AudioContext 一定要在使用者點擊時建立或 resume，之後計時器數秒後播放才有聲音。 */
let audioCtx = null, audioMaster = null, audioPrimed = false;
function audioReady() {
  if (!settings.sound) return null;                   // 音效關閉：倒數與結束音都不播
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  try {
    if (!audioCtx) {
      audioCtx = new AC();
      audioMaster = audioCtx.createGain();
      audioMaster.gain.value = 0.55;                  // 整體音量適中
      audioMaster.connect(audioCtx.destination);
    }
    if (audioCtx.state !== 'running') audioCtx.resume().catch(() => {});
    return audioCtx;
  } catch (e) { return null; }
}
/** 在使用者點擊時呼叫：建立／恢復 AudioContext，並播放一個無聲的極短音，讓 iOS 解除靜音限制 */
function unlockAudio() {
  const ctx = audioReady();
  if (!ctx || audioPrimed) return;
  try {
    const buf = ctx.createBuffer(1, 1, 22050), src = ctx.createBufferSource();
    src.buffer = buf; src.connect(ctx.destination); src.start(0);
    audioPrimed = true;
  } catch (e) { /* 忽略 */ }
}
/** 一個柔和的音：淡入 20ms，再以指數曲線淡出 */
function playTone(freq, startIn, dur, peak) {
  const ctx = audioCtx, t0 = ctx.currentTime + startIn;
  [[freq, 'sine', peak], [freq * 2, 'triangle', peak * 0.12]].forEach(([f, type, pk]) => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(pk, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(audioMaster);
    o.start(t0); o.stop(t0 + dur + 0.05);
  });
}
/** 音效表：[頻率 Hz, 延遲秒, 長度秒, 音量] */
const SOUNDS = {
  countdown: [[880, 0, 0.22, 0.2]],                                       // 倒數 3、2、1：短而清楚的一聲
  end: [[659.25, 0, 0.5, 0.24], [987.77, 0.16, 0.8, 0.22]],               // 時間結束：上行雙音
  finish: [[523.25, 0, 0.45, 0.22], [659.25, 0.14, 0.45, 0.22], [783.99, 0.28, 0.9, 0.22]], // HIIT 全部結束：三音短旋律
  toWork: [[659.25, 0, 0.35, 0.2], [880, 0.12, 0.55, 0.22]],              // HIIT 換到「動」：上行雙音
  toRest: [[783.99, 0, 0.35, 0.2], [587.33, 0.12, 0.6, 0.2]]              // HIIT 換到「休息」：下行雙音
};
function playSound(name) {
  const ctx = audioReady(); if (!ctx) return;
  try { SOUNDS[name].forEach(([f, d, len, pk]) => playTone(f, d, len, pk)); } catch (e) { /* 忽略 */ }
}
/** 其他地方（完成一組、升級、Boss）沿用 beep()，改成同樣柔和的音色 */
function beep(times = 1, freq = 880) {
  const ctx = audioReady(); if (!ctx) return;
  try { for (let i = 0; i < times; i++) playTone(freq, i * 0.16, 0.22, 0.16); } catch (e) { /* 忽略 */ }
}
function buzz(pattern) { if (settings.vibrate && navigator.vibrate) navigator.vibrate(pattern); }

function startTimer(seconds, label, mode = 'rest', onDone = null) {
  Object.assign(timer, { on: true, mode, label, total: seconds, endAt: Date.now() + seconds * 1000, pausedLeft: null, phases: null, phaseIdx: 0, onDone, cue: {} });
  renderTimer();
}
/** 間歇計時：phases = [{sec, label, mode}] */
function startPhases(phases, onDone) {
  Object.assign(timer, { phases, phaseIdx: 0, onDone });
  const p = phases[0];
  Object.assign(timer, { on: true, mode: p.mode, label: p.label, total: p.sec, endAt: Date.now() + p.sec * 1000, pausedLeft: null, cue: {} });
  renderTimer();
}
function timerLeftMs() { return timer.pausedLeft !== null ? timer.pausedLeft : Math.max(0, timer.endAt - Date.now()); }
function stopTimer() { timer.on = false; timer.phases = null; timer.cue = {}; renderTimer(); }
/** 時間到（或手動跳過，skipped = true 時不播提示音；震動維持原本行為） */
function timerFinished(skipped = false) {
  const curPhase = timer.phases ? timer.phases[timer.phaseIdx] : null;
  if (curPhase && curPhase.onEnd) curPhase.onEnd();
  if (timer.phases && timer.phaseIdx < timer.phases.length - 1) {
    timer.phaseIdx++;
    const p = timer.phases[timer.phaseIdx];
    // 切換到下一個 HIIT 階段：重新計算倒數
    Object.assign(timer, { mode: p.mode, label: p.label, total: p.sec, endAt: Date.now() + p.sec * 1000, cue: {} });
    if (!skipped) playSound(p.mode === 'work' ? 'toWork' : 'toRest');
    buzz(150);
    renderTimer();
    return;
  }
  if (!skipped) playSound(timer.phases ? 'finish' : 'end');
  buzz([200, 100, 200]);
  const cb = timer.onDone;
  stopTimer();
  if (cb) cb();
}
function renderTimer() {
  const el = document.getElementById('timerBar');
  document.body.classList.toggle('timer-on', timer.on);
  if (!timer.on) { el.classList.add('hidden'); el.innerHTML = ''; return; }
  el.classList.remove('hidden');
  el.classList.toggle('work', timer.mode === 'work');
  const left = timerLeftMs();
  const pct = timer.total ? Math.max(0, Math.min(100, (left / (timer.total * 1000)) * 100)) : 0;
  const phaseTxt = timer.phases ? `（${timer.phaseIdx + 1}/${timer.phases.length}）` : '';
  el.innerHTML = `<div class="inner">
      <div class="t-num" id="tNum">${fmtDur(Math.ceil(left / 1000) * 1000)}</div>
      <div class="grow"><div class="t-lbl">${esc(timer.label)} ${phaseTxt}${timer.pausedLeft !== null ? '<span class="yellow">（暫停中）</span>' : ''}</div>
        <div class="bar thin exp"><i id="tBar" style="width:${pct}%"></i></div></div>
    </div>
    <div class="inner"><div class="t-btns grow">
      <button class="btn ghost" data-act="timerAdj" data-v="-15">−15 秒</button>
      <button class="btn ghost" data-act="timerAdj" data-v="15">＋15 秒</button>
      <button class="btn ghost" data-act="timerPause">${timer.pausedLeft !== null ? '▶ 繼續' : '⏸ 暫停'}</button>
      <button class="btn orange" data-act="timerSkip">跳過 ⏭</button>
    </div></div>`;
}
function tick() {
  if (timer.on && timer.pausedLeft === null) {
    const left = timerLeftMs();
    const n = document.getElementById('tNum'), b = document.getElementById('tBar');
    if (n) n.textContent = fmtDur(Math.ceil(left / 1000) * 1000);
    if (b && timer.total) b.style.width = Math.max(0, (left / (timer.total * 1000)) * 100) + '%';
    if (left <= 0) timerFinished();
    else {
      // 倒數 3、2、1：每一秒只播一次（tick 每 250ms 執行，用 timer.cue 記錄已播過的秒數）
      // 只播「現在這一秒」，不補播被跳過的秒數（例如背景分頁延遲），避免一次響好幾聲
      const sec = Math.ceil(left / 1000);
      if (sec <= 3 && !timer.cue[sec]) { timer.cue[sec] = true; playSound('countdown'); }
    }
  }
  const el = document.getElementById('sessElapsed');
  if (el && training.active) el.textContent = fmtDur(elapsedMs(training.active));
}

    const typeBox = requireText ? `<label class="f mt">請輸入「${esc(requireText)}」確認<input type="text" id="cfType" autocomplete="off"></label><p class="small red hidden" id="cfTypeErr">輸入的文字不正確，沒有執行。</p>` : '';
    openModal(esc(title), `<div>${body}</div>${typeBox}<div class="btn-row mt">
      <button class="btn ghost" id="cfNo">${esc(cancelText)}</button>
      <button class="btn ${danger ? 'red' : 'green'}" id="cfYes">${esc(okText)}</button></div>`);
    document.getElementById('cfYes').onclick = () => {
      if (requireText) {   // 必須正確輸入指定文字，否則不關閉、不執行

}

/** 左右側欄位名稱（次數：repsL/repsR；秒數：secondsL/secondsR） */
function sideKeys(def) { return def.type === 'time' ? ['secondsL', 'secondsR', 'seconds'] : ['repsL', 'repsR', 'reps']; }
function hasSides(x, def) { const [l, r] = sideKeys(def); return num(x[l]) !== null || num(x[r]) !== null; }
function setSummaryText(x, def) {
  const parts = [];
  const unit = def.type === 'time' ? '秒' : '下';
  if (def.type === 'hiit') parts.push(x.done ? '已完成本輪' : '');
  else if (def.perSide && hasSides(x, def)) { const [l, r] = sideKeys(def); parts.push(`左 ${x[l] === '' || x[l] == null ? '—' : x[l]}／右 ${x[r] === '' || x[r] == null ? '—' : x[r]} ${unit}`); }

  return parts.filter(Boolean).join(' · ');
}
function lastRecordHTML(def, excludeId) {

      <button class="btn big block green mt" data-act="startDay" data-day="${d.id}">⚔ 開始訓練</button>
      <button class="btn block ghost mt" data-act="viewPlan" data-day="${d.id}">查看完整課表</button>`;
  } else if (sug.type === 'doneToday') {
    h += `<h2>今天的訓練完成了 🎉</h2><p>好好吃飯、好好休息，恢復也是訓練的一部分。</p>`;
  } else {
    h += `<h2>${sug.type === 'weekDone' ? '本週 4 練全部完成！' : '今天是休息日'}</h2>
      <p class="small">休息不會中斷任何紀錄。${esc(NUTRITION_NOTES[3])}</p>
      <button class="btn block mt" data-act="openVideos">🎬 看收藏影片（選做，只當參考、不記錄）</button>`;
  }
  h += `</div>`;

  // 本週
  h += `<div class="box"><div class="box-title">THIS WEEK</div>
    <div class="row between"><b>本週有參與訓練</b><span class="px yellow">${done.size}/4</span></div>
    <div class="bar gold mt"><i style="width:${Math.min(100, done.size * 25)}%"></i></div>
    <div class="row between mt"><b>完整完成課表</b><span class="px lime">${fullDone.size}/4</span></div>
    <div class="bar mt"><i style="width:${Math.min(100, fullDone.size * 25)}%"></i></div>
    <div class="week-grid">${WEEKDAY_ZH.map((w, i) => {
      const date = addDays(wk, i);
      const plan = FORMAL_DAYS.find(d => d.weekday === i);
      const daySess = completedSessions().filter(s => s.date === date && sessionCounts(s));
      const did = daySess.map(s => DAY[s.dayId].short + (sessionFull(s) ? '' : '（部分）'));
      const allFull = daySess.length && daySess.every(sessionFull);
      return `<div class="week-cell ${date === today ? 'today' : ''} ${did.length ? (allFull ? 'done' : 'part') : ''}">
        <div class="wd">${w}</div><div class="pl">${plan ? esc(plan.short) : '<span class="dim">休息</span>'}</div>
        ${did.length ? `<div class="ck">✓</div><div class="tiny">${did.map(esc).join('<br>')}</div>` : ''}</div>`;
    }).join('')}</div>
    <p class="tiny muted mt">${esc(PLAN_META.schedule)}。綠色＝完整完成、黃色＝部分完成。</p></div>`;

  // 最近一次
  if (last) {
    const sm = summarize(last);
    const rw = game.awarded[last.id];
    h += `<div class="box"><div class="box-title">LAST QUEST</div>
      <p><b>${fmtDate(last.date)}｜${esc(DAY[last.dayId].short)}</b> ${esc(DAY[last.dayId].title)} <span class="tag ${sm.full ? 'ok' : 'warn'}">${sm.full ? '完整完成' : '部分完成'}</span></p>
      <div class="stat-tiles">
        <div class="tile"><div class="k">完整／部分完成動作</div><div class="v">${sm.outcomes.full}／${sm.outcomes.partial}</div></div>
        <div class="tile"><div class="k">完成組數</div><div class="v">${sm.setCount}</div></div>
        <div class="tile"><div class="k">訓練時間</div><div class="v">${fmtMin(sm.durationMs)}</div></div>
        <div class="tile"><div class="k">獲得</div><div class="v">${rw ? `+${rw.exp} EXP` : '—'}</div></div>
      </div>
      <button class="btn block ghost mt" data-act="histDetail" data-id="${last.id}">查看紀錄</button></div>`;
  }
  return h;
}

/* ---------- 訓練頁（課表 / 紀錄 / 統計） ---------- */
function viewWorkout() {
  const subs = [['plan', '📜 課表'], ['history', '📖 紀錄'], ['stats', '📊 統計'], ['videos', '🎬 影片']];
  let h = `<div class="seg">${subs.map(([k, l]) => `<button class="${ui.workoutSub === k ? 'on' : ''}" data-act="workoutSub" data-sub="${k}">${l}</button>`).join('')}</div>`;
  if (training.active) {
    h += `<div class="box warn"><div class="box-title">未完成的訓練</div><p>${esc(DAY[training.active.dayId].title)}（${fmtDate(training.active.date)}）</p>
      <button class="btn block yellow" data-act="resumeSession">▶ 繼續訓練</button></div>`;
  }
  if (ui.workoutSub === 'history') return h + viewHistory();
  if (ui.workoutSub === 'stats') return h + viewStats();
  if (ui.workoutSub === 'videos') return h + viewVideos();
  return h + viewPlan();
}

function viewPlan() {
  if (!ui.planDay) { const sug = todaySuggestion(); ui.planDay = sug.day ? sug.day.id : 'd1'; }
  const d = DAY[ui.planDay];
  let h = `<div class="seg">${DAYS.map(x => `<button class="${x.id === d.id ? 'on' : ''}" data-act="planDay" data-day="${x.id}">${esc(x.label)}<br><span class="tiny">${esc(x.short)}</span></button>`).join('')}</div>`;
  h += gearBarHTML();

  h += `<div class="box alt"><div class="box-title">${esc(d.code)}</div>
    <h2>${esc(d.title)}</h2><p class="small muted">${esc(d.header)}</p>
    <button class="btn big block green mt" data-act="startDay" data-day="${d.id}">⚔ 開始這一天的訓練</button></div>`;

  if (d.warmup) h += `<div class="box"><div class="box-title">熱身</div><b>${esc(d.warmup.title)}</b>${warmupHTML(d.warmup)}</div>`;

  d.exercises.forEach((def, i) => {
    const key = 'plan_' + def.id;
    h += `<div class="ex-card">
      <div class="ex-head" data-act="toggleInfo" data-k="${key}"><div class="ex-num">${pad(i + 1)}</div>
        <div class="grow"><div class="ex-name">${esc(def.name)}</div>${exMetaHTML(def)}</div></div>
      <button class="toggle-link" data-act="toggleInfo" data-k="${key}">${ui.info[key] ? '▲ 收合說明' : '▼ 動作說明、注意事項、替代動作'}</button>
      ${ui.info[key] ? exerciseInfoHTML(def) + lastRecordHTML(def) : ''}
    </div>`;
  });

  if (d.cooldown) h += `<div class="box"><div class="box-title">收操 5 分鐘</div>${cooldownHTML(d.cooldown)}</div>`;

  h += `<div class="box warn"><div class="box-title">身體狀況守則</div>${rulesList(SAFETY_RULES)}
    <p class="tiny muted">疼痛分數是自我感受紀錄，不是醫療診斷。</p></div>
    <div class="box good"><div class="box-title">怎麼進步</div>${rulesList(PROGRESSION_RULES)}
    <p class="tiny muted">遊戲會在符合條件時提示，但不會自動更改課表。</p></div>
    <div class="box"><div class="box-title">飲食搭配</div>${rulesList(NUTRITION_NOTES)}</div>
    <div class="box"><div class="box-title">課表總覽</div>
      <ul class="rules"><li>${esc(PLAN_META.schedule)}</li><li>${esc(PLAN_META.split)}</li><li>器材：${esc(PLAN_META.equipment)}<br><span class="small muted">實際：阻力帶 ${GEAR.bandLb} lb、水瓶 ${GEAR.bottleKg} kg、單腳提踵用瑜伽磚</span></li><li>${esc(PLAN_META.flow)}</li></ul></div>
    <div class="box good"><div class="box-title">已確認</div>${rulesList(confirmedNotes())}</div>
    ${DATA_GAPS.length ? `<details class="box"><summary>待確認的資料（${DATA_GAPS.length} 項）</summary>${rulesList(DATA_GAPS)}</details>` : ''}`;
  return h;
}

/* ---------- 收藏的影片（只當參考，不記錄、不給經驗值） ---------- */
function viewVideos() {
  let h = `<div class="box alt"><div class="box-title">收藏的影片</div>
    <p class="small">新版課表「收藏的影片（可以做的）」。<b>只當參考，不記錄訓練、不給經驗值。</b></p></div>`;
  VIDEO_LIBRARY.forEach(cat => {
    h += `<div class="box"><div class="box-title">${esc(cat.title)}</div>
      ${cat.note ? `<p class="small">${esc(cat.note)}</p>` : ''}
      ${cat.items.map(v => `<div class="info"><b>${esc(v.name)}</b><div class="small">${esc(v.desc)}</div><a href="${esc(v.url)}" target="_blank" rel="noopener">▶ 開啟影片</a></div>`).join('')}</div>`;
  });
  return h;
}

/* ---------- 訓練進行中 ---------- */
function currentSetIndex(e, idx) {
  const f = ui.focus[idx];
  if (f !== undefined && e.sets[f] && !e.sets[f].dropped) return f;
  if (isLightDone(e)) return -1;     // 已用 3 分鐘腿部訓練替代：不再要求其他輪
  return e.sets.findIndex(isOpenSet);
}
function viewSession() {
  const s = training.active, d = DAY[s.dayId];
  const handled = s.exercises.filter(e => exerciseOutcome(e) !== 'none').length;
  const curIdx = s.exercises.findIndex(e => e.status === 'pending');
  let h = '';

  h += `<div class="box gold sess-head" style="margin-top:6px">
    <div class="row between"><div class="grow"><span class="tag">${esc(d.label)} · ${esc(d.short)}</span><div class="ex-name">${esc(d.title)}</div></div>
      <div class="center"><div class="tiny muted">訓練時間</div><div class="elapsed" id="sessElapsed">${fmtDur(elapsedMs(s))}</div></div></div>
    <div class="bar mt"><i style="width:${(handled / s.exercises.length) * 100}%"></i></div>
    <div class="row between tiny muted" style="margin-top:4px"><span>動作進度 ${handled}/${s.exercises.length}</span><span>自動保存中</span></div>
    <div class="btn-row mt">
      <button class="btn sm ghost" data-act="pauseSession">⏸ 暫停</button>
      <button class="btn sm ghost" data-act="leaveSession">💾 暫離</button>
      <button class="btn sm green" data-act="finishSession">🏁 結束</button></div></div>`;

  if (s.pausedAt) {
    h += `<div class="paused-veil"><div class="px">PAUSED</div><p>訓練已暫停，計時也暫停了。<br>進度已自動保存。</p>
      <button class="btn big yellow" data-act="resumeTimerSession">▶ 繼續訓練</button>
      <button class="btn ghost" data-act="leaveSession">回到首頁（保留進度）</button></div>`;
  }

  // 開始前身體狀況
  const p = s.precheck;
  if (p) {
    const hi = Math.max(p.shoulder, p.back, p.wrist);
    const stopNames = d.exercises.filter(def => painStopReasons(p, def).length).map(def => def.name);
    const cls = stopNames.length || hi >= 4 || p.numb === 'worse' ? 'stop' : hi > 0 ? 'mid' : 'ok';
    h += `<div class="alert ${cls}">開始前：肩 ${p.shoulder} · 下背 ${p.back} · 手腕 ${p.wrist}／手麻：${p.numb === 'worse' ? '比平常明顯' : p.numb === 'same' ? '和平常一樣' : '沒有'}
      ${stopNames.length ? `<br>⚠ 請停止的動作（已在卡片上標紅）：${stopNames.map(esc).join('、')}。其他動作可以照常做。` : cls === 'stop' ? '<br>⚠ 訓練中只要引起疼痛，就用「回報疼痛」停下。' : ''}</div>`;
  }
  if (s.worseNote) h += `<div class="alert mid">📋 上次隔天檢查「變更糟」：依課表守則，這次少做一組。可以在動作卡片按「－ 這次少做一組」，只影響這次紀錄，課表的預設組數不變；做完調整後的組數就算完整完成。<br><span class="small">減量不代表可以帶痛訓練：疼痛 4 分以上或手麻變明顯，一樣請改做替代動作或跳過。</span></div>`;

  h += `<details class="box warn" style="margin-top:16px"><summary>身體狀況守則</summary>${rulesList(SAFETY_RULES)}</details>`;

  if (d.warmup) {
    h += `<div class="ex-card ${s.warmupDone ? 'done' : ''}"><div class="row between"><b>🔥 ${esc(d.warmup.title)}</b>
      <label class="row small"><input type="checkbox" data-act="toggleWarmup" ${s.warmupDone ? 'checked' : ''}>已完成</label></div>
      ${warmupHTML(d.warmup)}</div>`;
  }

  s.exercises.forEach((e, idx) => { h += sessionCardHTML(s, e, idx, idx === curIdx); });

  if (d.cooldown) {
    h += `<div class="ex-card ${s.cooldownDone ? 'done' : ''}"><div class="row between"><b>🧊 收操 5 分鐘</b>
      <label class="row small"><input type="checkbox" data-act="toggleCooldown" ${s.cooldownDone ? 'checked' : ''}>已完成</label></div>
      ${cooldownHTML(d.cooldown)}</div>`;
  }
  h += `<button class="btn big block green" data-act="finishSession" style="margin:10px 3px">🏁 結束訓練並結算</button>`;
  return h;
}

function sessionCardHTML(s, e, idx, isCurrent) {
  const base = EX[e.exerciseId];
  const def = variantDef(base, e.altIndex);   // 目前選的版本（原動作或替代動作）
  const statusCls = e.status === 'done' ? 'done' : e.status === 'skipped' ? 'skipped' : def.isAlt ? 'swapped' : painStopReasons(s.precheck, base).length ? 'flagged' : isCurrent ? 'current' : '';
  const open = ui.open[idx] !== undefined ? ui.open[idx] : e.status === 'pending';
  const ds = doneSets(e).length;
  const targetSets = e.sets.filter(isTargetSet).length;
  const oc = exerciseOutcome(e);
  const statusTag = oc === 'full' ? '<span class="tag ok">✓ 完整完成</span>'
    : oc === 'safe' ? '<span class="tag info">疼痛安全跳過</span>'
    : oc === 'skip' ? `<span class="tag skip">已跳過（${esc(skipReasonText(e.skipReason))}）</span>`
    : oc === 'partial' ? '<span class="tag warn">部分完成</span>' : '';
  const altTag = def.isAlt ? `<span class="tag info">替代動作（原：${esc(base.name)}）</span>` : '';
  let h = `<div class="ex-card ${statusCls}" id="card${idx}">
    <div class="ex-head" data-act="toggleCard" data-i="${idx}"><div class="ex-num">${pad(idx + 1)}</div>
      <div class="grow"><div class="ex-name">${esc(def.name)}</div>
        <div class="row wrap small" style="gap:4px;margin-top:2px">${statusTag}${altTag}<span class="muted">${isLightDone(e) ? '已用 3 分鐘腿部訓練替代' : def.light ? '做 1 次、3 分鐘' : `${ds}/${targetSets} ${base.type === 'hiit' ? '輪' : '組'}`}</span></div></div>
      <div class="muted">${open ? '▲' : '▼'}</div></div>`;
  if (!open) return h + '</div>';

  if (base.alternatives.length && e.status !== 'skipped') {
    h += `<div class="variant-pick"><span class="lbl">要做哪個動作？（可以隨時換回來）</span>
      <button class="vbtn ${def.isAlt ? '' : 'on'}" data-act="pickVariant" data-i="${idx}" data-v="">原動作：${esc(base.name)}</button>
      ${base.alternatives.map((a, k) => `<button class="vbtn ${e.altIndex === k ? 'on' : ''}" data-act="pickVariant" data-i="${idx}" data-v="${k}">🔁 替代：${esc(a.name)}</button>`).join('')}</div>`;
  }
  h += exMetaHTML(def);
  if (def.inheritNote) h += `<p class="tiny muted">${esc(def.inheritNote)}</p>`;
  if (e.reduced) {
    const baseCount = e.sets.filter(x => !x.extra).length;
    h += `<div class="alert mid">📉 本次目標 ${targetSets} 組（課表原本 ${baseCount} 組）。上次隔天檢查變更糟，這次少做 ${e.reduced.count} 組；只影響這次紀錄，課表不變。</div>`;
  }
  const ik = 'sess_' + idx;
  h += `<button class="toggle-link" data-act="toggleInfo" data-k="${ik}">${ui.info[ik] ? '▲ 收合說明' : '▼ 動作說明、注意事項、替代動作'}</button>`;
  if (ui.info[ik]) h += exerciseInfoHTML(def);
  h += lastRecordHTML(def, s.id);

  // 開始前回報的部位疼痛 → 這個動作建議停止
  const stopR = painStopReasons(s.precheck, base);
  if (stopR.length && oc !== 'safe' && oc !== 'full') {
    h += `<div class="alert stop">⚠ 開始前回報：${stopR.map(esc).join('、')}。請停止這個動作，${base.alternative ? '改做原始課表的替代動作或跳過。' : '原始課表沒有替代動作，請跳過。'}不要為了 EXP 或成就忍痛。
      ${base.alternative ? `<div class="small" style="margin-top:4px">替代：${esc(base.alternative)}</div>` : ''}
      <div class="btn-row mt">${base.alternatives.length && !def.isAlt ? `<button class="btn sm" data-act="painSwap" data-i="${idx}">🔁 換成替代動作</button>` : ''}
        <button class="btn sm orange" data-act="painSkip" data-i="${idx}">⏭ 跳過（疼痛安全跳過）</button></div></div>`;
  }
  // 疼痛回報紀錄
  if (e.painReports && e.painReports.length) {
    const lp = e.painReports[e.painReports.length - 1];
    if (lp.score !== null && lp.score !== undefined) h += `<div class="alert ${lp.score >= 4 || lp.numb ? 'stop' : 'mid'}">疼痛回報：${lp.score} 分${lp.numb ? '、手麻加劇' : ''}${lp.score >= 4 || lp.numb ? '（請停止這個動作）' : ''}</div>`;
  }

  if (e.status === 'skipped') {
    h += `<div class="card-actions"><button class="btn sm ghost" data-act="unskip" data-i="${idx}">↺ 取消跳過</button></div></div>`;
    return h;
  }

  // 每組
  const cur = currentSetIndex(e, idx);
  const lightMode = def.light || isLightDone(e);   // 3 分鐘腿部訓練：只顯示一筆，不列出其他輪
  if (lightMode) h += `<p class="tiny muted">3 分鐘腿部訓練是 HIIT 的輕鬆版替代：做 1 次、完整 3 分鐘就算完成，不和 HIIT 重複計算。</p>`;
  e.sets.forEach((x, i) => {
    const rowDef = x.done ? variantDef(base, x.alt) : def;   // 已完成的組依當時實際做的動作顯示
    const lbl = rowDef.light ? '3 分鐘腿部訓練' : base.type === 'hiit' ? `第 ${i + 1} 輪` : `第 ${i + 1} 組`;
    if (x.dropped) { h += `<div class="set-row" style="opacity:.55;cursor:default"><span class="sl">${lbl}</span><span class="sv">本次減量，不用做</span></div>`; return; }
    if (lightMode && !x.done && i !== cur) return;
    if (i === cur) h += setEditorHTML(def, e, idx, x, i, lbl);
    else h += `<div class="set-row ${x.done ? 'done' : ''}" data-act="focusSet" data-i="${idx}" data-s="${i}">
      <span class="sl">${x.done ? '✓ ' : ''}${lbl}${x.extra ? '<span class="tiny muted">（額外）</span>' : ''}</span>
      <span class="sv">${x.done ? ((x.alt ?? null) !== (e.altIndex ?? null) ? `<span class="cyan">${esc(variantName(base, x.alt))}</span> ` : '') + (esc(setSummaryText(x, rowDef)) || '已完成') : '待完成'}</span><span class="small cyan">${x.done ? '修改' : '輸入'}</span></div>`;
  });

  h += `<div class="card-actions">
    <button class="btn sm orange" data-act="painReport" data-i="${idx}">😣 回報疼痛</button>
    <button class="btn sm ghost" data-act="skipEx" data-i="${idx}">⏭ 跳過</button>
    ${ds >= targetSets && base.type !== 'hiit' ? `<button class="btn sm ghost" data-act="addSet" data-i="${idx}">＋ 額外一組</button>` : ''}
    ${s.worseNote && base.type !== 'hiit' ? (e.reduced
      ? `<button class="btn sm ghost" data-act="restoreSet" data-i="${idx}">↺ 恢復原本組數</button>`
      : canReduce(e) ? `<button class="btn sm yellow" data-act="reduceSet" data-i="${idx}">－ 這次少做一組</button>` : '') : ''}
  </div>
  ${ds >= targetSets && base.type !== 'hiit' ? '<p class="tiny muted">額外組數只做紀錄，不另外給 EXP；是否加量請依課表進步原則判斷。</p>' : ''}</div>`;
  return h;
}

/** 可以減一組：還沒減過、減完至少剩 1 組、還有沒做的規定組（不動已完成或跳過的紀錄） */
function canReduce(e) {
  if (e.reduced || e.status === 'skipped') return false;
  const target = e.sets.filter(isTargetSet);
  return target.length > 1 && target.some(x => !x.done);
}

function setEditorHTML(def, e, idx, x, i, lbl) {
  const f = (field) => `data-field="${field}" data-i="${idx}" data-s="${i}"`;
  const last = lastRecord(def.moveKey, training.active.id);
  const lastSet = last && last.sets[i];
  let h = `<div class="set-edit"><div class="sl"><span>▶ ${lbl}${x.extra ? '（額外）' : ''}</span>
    <span class="small muted">${def.type === 'hiit' ? `${def.hiitMoves.length} 動作 × 做 ${def.duration} 秒／休 ${def.restSeconds} 秒` : def.light ? `目標：做 1 次、完整 ${def.duration / 60} 分鐘（${def.duration} 秒）` : def.type === 'time' ? `目標 ${def.duration} 秒${def.perSide ? '（每邊）' : ''}` : `目標 ${def.repMin}${def.repMax !== def.repMin ? '–' + def.repMax : ''} 下${def.perSide ? '（每邊）' : ''}${def.inherited ? '（沿用原動作）' : ''}`}</span></div>`;
  if (def.type === 'hiit') {
    h += `<p class="small">${def.hiitMoves.map(esc).join(' → ')}</p>
      <button class="btn block ghost" data-act="startHiit" data-i="${idx}">⏱ 開始間歇計時：剩下 ${e.sets.filter(y => !y.done).length} 輪連續跑（做 ${def.duration} 秒／休 ${def.restSeconds} 秒）</button>

          ${def.type === 'time' ? `<button class="btn sm ghost" data-act="startWork" data-i="${idx}" data-s="${i}">⏱ 計時 ${def.duration} 秒（單邊）</button>` : ''}</div>`;

        <div class="f" style="justify-content:flex-end"><button class="btn ghost" data-act="startWork" data-i="${idx}" data-s="${i}">⏱ 計時 ${def.duration} 秒</button></div>`;
    } else {
      h += `<label class="f">實際次數${def.perSide ? '（每邊）' : ''}<input class="big-num" type="number" inputmode="numeric" min="0" ${f('reps')} value="${esc(x.reps)}" placeholder="${lastSet && num(lastSet.reps) !== null ? '上次 ' + esc(lastSet.reps) : def.repMin + '–' + def.repMax}"></label>
        <label class="f">RIR（還能做幾下）<select ${f('rir')}>${['', '0', '1', '2', '3', '4', '5+'].map(v => `<option value="${v}" ${String(x.rir) === v ? 'selected' : ''}>${v === '' ? '—' : v}</option>`).join('')}</select></label>`;

      <label class="f">阻力帶／阻力<input type="text" ${f('band')} value="${esc(x.band)}" placeholder="${lastSet && lastSet.band ? esc(lastSet.band) : '例：' + GEAR.bandLabel}"></label>`;
    if (def.type === 'time') h += `<label class="f full">RIR（可空白）<select ${f('rir')}>${['', '0', '1', '2', '3', '4', '5+'].map(v => `<option value="${v}" ${String(x.rir) === v ? 'selected' : ''}>${v === '' ? '—' : v}</option>`).join('')}</select></label>`;
    h += `<label class="f full">備註<input type="text" ${f('note')} value="${esc(x.note)}" placeholder="例：右肩有點緊"></label></div>`;

  return h;
}

/* ---------- 統計 ---------- */
function barChartSVG(data, { color = '#41a6f6', target = null, unit = '', h = 170 } = {}) {
  const W = 340, padL = 34, padB = 26, padT = 14, H = h;
  const max = Math.max(target || 0, ...data.map(d => d.value), 1);
  const bw = (W - padL - 6) / data.length;
  const y = v => H - padB - (v / max) * (H - padB - padT);
  let g = '';
  [0, 0.5, 1].forEach(t => { const v = max * t; g += `<line x1="${padL}" x2="${W - 4}" y1="${y(v)}" y2="${y(v)}" stroke="#333c57"/><text x="${padL - 4}" y="${y(v) + 3}" fill="#94b0c2" font-size="9" text-anchor="end">${fmtNum(v)}</text>`; });
  data.forEach((d, i) => {
    const x = padL + i * bw + 2, top = y(d.value);
    g += `<rect x="${x}" y="${top}" width="${Math.max(2, bw - 4)}" height="${H - padB - top}" fill="${d.color || color}"/>`;
    if (d.value2) { const t2 = y(d.value2), w2 = Math.max(2, (bw - 4) / 2); g += `<rect x="${x + (bw - 4) / 4}" y="${t2}" width="${w2}" height="${H - padB - t2}" fill="#a7f070" stroke="#0d0e17" stroke-width="1"/>`; }
    if (d.value) g += `<text x="${x + (bw - 4) / 2}" y="${top - 3}" fill="#f4f4f4" font-size="9" text-anchor="middle">${fmtNum(d.value)}</text>`;
    if (data.length <= 8 || i % 2 === 0) g += `<text x="${x + (bw - 4) / 2}" y="${H - 10}" fill="#94b0c2" font-size="9" text-anchor="middle">${esc(d.label)}</text>`;
  });
  if (target) g += `<line x1="${padL}" x2="${W - 4}" y1="${y(target)}" y2="${y(target)}" stroke="#ffcd75" stroke-dasharray="4 3"/><text x="${W - 6}" y="${y(target) - 3}" fill="#ffcd75" font-size="9" text-anchor="end">目標 ${target}${unit}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" shape-rendering="crispEdges">${g}</svg>`;
}
function lineChartSVG(points, { color = '#a7f070', h = 170, unit = '' } = {}) {
  const W = 340, padL = 34, padB = 26, padT = 16, H = h;
  if (!points.length) return '<p class="muted small">還沒有資料。</p>';
  const vals = points.map(p => p.value);
  const max = Math.max(...vals), min = Math.min(...vals);
  const lo = Math.max(0, min - 1), hi = max + 1;
  const x = i => points.length === 1 ? (padL + W) / 2 : padL + 6 + i * ((W - padL - 16) / (points.length - 1));
  const y = v => H - padB - ((v - lo) / (hi - lo)) * (H - padB - padT);
  let g = '';
  [lo, (lo + hi) / 2, hi].forEach(v => { g += `<line x1="${padL}" x2="${W - 4}" y1="${y(v)}" y2="${y(v)}" stroke="#333c57"/><text x="${padL - 4}" y="${y(v) + 3}" fill="#94b0c2" font-size="9" text-anchor="end">${fmtNum(v)}</text>`; });
  g += `<polyline fill="none" stroke="${color}" stroke-width="2" points="${points.map((p, i) => `${x(i)},${y(p.value)}`).join(' ')}"/>`;
  points.forEach((p, i) => {
    g += `<rect x="${x(i) - 3}" y="${y(p.value) - 3}" width="6" height="6" fill="${color}"/>`;
    g += `<text x="${x(i)}" y="${y(p.value) - 7}" fill="#f4f4f4" font-size="9" text-anchor="middle">${fmtNum(p.value)}${unit}</text>`;
    if (points.length <= 8 || i % Math.ceil(points.length / 8) === 0) g += `<text x="${x(i)}" y="${H - 10}" fill="#94b0c2" font-size="9" text-anchor="middle">${esc(p.label)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" shape-rendering="crispEdges">${g}</svg>`;
}

const CATEGORY_LABEL = { chest: '胸', back: '背', legs: '腿', shoulders: '肩', arms: '手臂', core: '核心' };
const CATEGORY_COLOR = { chest: '#b13e53', back: '#3b5dc9', legs: '#38b764', shoulders: '#ef7d57', arms: '#ffcd75', core: '#73eff7' };

function viewStats() {
  const sessions = completedSessions().filter(sessionCounts);
  if (!sessions.length) return `<div class="box"><p>完成訓練後，這裡會出現每週次數、訓練量、肌群與動作進步圖表。</p></div>`;
  const ctx = buildContext();
  let totalSets = 0, totalVol = 0;
  sessions.forEach(s => { const sm = summarize(s); totalSets += sm.setCount; totalVol += sm.volume; });

  // 最近 12 週
  const thisWk = weekKey(ymd());
  const weeks = []; for (let i = 11; i >= 0; i--) weeks.push(addDays(thisWk, -7 * i));
  const wkLabel = w => { const d = parseYmd(w); return `${d.getMonth() + 1}/${d.getDate()}`; };
  const weeklyCount = weeks.map(w => ({ label: wkLabel(w), value: formalDaysDoneInWeek(w).size, value2: formalDaysFullInWeek(w).size }));
  const weeklyVol = weeks.map(w => ({ label: wkLabel(w), value: Math.round(sessionsInWeek(w).reduce((a, s) => a + summarize(s).volume, 0) * 10) / 10 }));

  // 肌群組數
  const since = ui.statsRange === '4w' ? addDays(thisWk, -21) : '0000-00-00';
  const cat = { chest: 0, back: 0, legs: 0, shoulders: 0, arms: 0, core: 0 };
  sessions.filter(s => s.date >= since).forEach(s => s.exercises.forEach(e => {
    // 依每一組實際做的動作分類（替代動作算在它自己的肌群），每組只算一次
    groupSetsByVariant(e).forEach(({ v, sets }) => { if (cat[v.category] !== undefined) cat[v.category] += sets.length; });
  }));

  // 動作進步
  const moves = [];
  const seen = new Set();
  FORMAL_DAYS.forEach(d => d.exercises.forEach(def => {
    if (def.type === 'hiit') return;
    [def, ...def.alternatives.map((a, k) => variantDef(def, k))].forEach(v => {
      if (seen.has(v.moveKey)) return;
      seen.add(v.moveKey); moves.push(v);
    });
  }));
  if (!ui.statsMove) { const withData = moves.find(m => moveHistory(m.moveKey).length); ui.statsMove = (withData || moves[0]).moveKey; }
  const mdef = moves.find(m => m.moveKey === ui.statsMove) || moves[0];
  const mh = moveHistory(mdef.moveKey);
  const ptsBest = mh.map(r => ({ label: `${parseYmd(r.session.date).getMonth() + 1}/${parseYmd(r.session.date).getDate()}`, value: bestOf(r.sets, mdef.type).best })).filter(p => p.value !== null);
  const ptsW = mh.map(r => ({ label: `${parseYmd(r.session.date).getMonth() + 1}/${parseYmd(r.session.date).getDate()}`, value: bestOf(r.sets, mdef.type).maxW })).filter(p => p.value !== null);

  let h = `<div class="box"><div class="box-title">總覽</div><div class="stat-tiles">
      <div class="tile"><div class="k">正式訓練（有參與）</div><div class="v">${ctx.formal} 次</div></div>
      <div class="tile"><div class="k">完整完成課表</div><div class="v">${ctx.formalFull} 次</div></div>
      <div class="tile"><div class="k">完成組數</div><div class="v">${totalSets}</div></div>
      <div class="tile"><div class="k">訓練量（有填重量）</div><div class="v">${fmtNum(totalVol)} kg</div></div>
      <div class="tile"><div class="k">4 練都完整的週數</div><div class="v">${ctx.goalWeeks}</div></div>
      <div class="tile"><div class="k">進步紀錄</div><div class="v">${ctx.prCount}</div></div></div></div>

    <div class="box"><div class="box-title">每週訓練次數</div>${barChartSVG(weeklyCount, { color: '#38b764', target: 4, unit: ' 次' })}
      <p class="tiny muted"><span style="color:#38b764">■</span> 有參與訓練　<span style="color:#a7f070">■</span> 完整完成課表。最近 12 週，只算正式訓練日（同一週同一天重複練只算 1 次）。</p></div>

    <div class="box"><div class="box-title">每週訓練量 kg</div>${barChartSVG(weeklyVol, { color: '#41a6f6' })}
      <p class="tiny muted">只計算有填重量的組數（重量 × 次數）。阻力帶、徒手動作沒有重量，不會被換算或混在一起比較。</p></div>

    <div class="box"><div class="box-title">各肌群完成組數</div>
      <div class="seg"><button class="${ui.statsRange === 'all' ? 'on' : ''}" data-act="statsRange" data-v="all">全部</button><button class="${ui.statsRange === '4w' ? 'on' : ''}" data-act="statsRange" data-v="4w">最近 4 週</button></div>
      ${barChartSVG(Object.keys(cat).map(k => ({ label: CATEGORY_LABEL[k], value: cat[k], color: CATEGORY_COLOR[k] })))}
      <p class="tiny muted">組數是紀錄次數，不是力量指標。替代動作依實際做的動作分類；HIIT 與 3 分鐘腿部訓練不算肌群組數。</p></div>

    <div class="box"><div class="box-title">單一動作的歷史</div>
      <label class="f">選擇動作<select data-change="statsMove">${moves.map(m => `<option value="${m.moveKey}" ${m.moveKey === mdef.moveKey ? 'selected' : ''}>${esc(m.name)}${moveHistory(m.moveKey).length ? '' : '（無紀錄）'}</option>`).join('')}</select></label>
      <h3 class="mt">每次最佳${mdef.type === 'time' ? '秒數' : '次數'}</h3>${lineChartSVG(ptsBest, { unit: mdef.type === 'time' ? 's' : '' })}
      ${ptsW.length ? `<h3 class="mt">最大重量 kg</h3>${lineChartSVG(ptsW, { color: '#ffcd75' })}` : '<p class="tiny muted">這個動作沒有填過重量，所以沒有重量圖表。</p>'}
      ${mh.length ? `<div class="scroll-x mt"><table class="t"><tr><th>日期</th><th>每組</th><th>重量／阻力</th></tr>${mh.slice().reverse().map(r => `<tr><td>${fmtDate(r.session.date)}</td><td>${r.sets.map(x => mdef.type === 'time' ? (x.seconds ?? '—') + 's' : (x.reps ?? '—')).join(' / ')}</td><td>${esc([...new Set(r.sets.map(x => [num(x.weight) !== null ? x.weight + 'kg' : '', x.band].filter(Boolean).join(' ')).filter(Boolean))].join('、') || '—')}</td></tr>`).join('')}</table></div>` : ''}
      <p class="tiny muted">只和同一個動作比較。換了阻力帶或器材時，數字不能直接當成力量變化，請搭配阻力欄位一起看。</p></div>`;
  return h;
}

/* ---------- 世界地圖 ---------- */
function worldMapSVG(ctx) {
  const nodes = [[40, 180], [110, 130], [60, 70], [170, 60], [250, 110], [290, 40]];
  let curIdx = 0;
  REGIONS.forEach((r, i) => { if (ctx.level >= r.levelReq) curIdx = i; });
  let g = `<rect width="340" height="220" fill="#1a1c2c"/>`;
  // 地形色塊
  const blobs = [[0, 140, 120, 80], [70, 95, 100, 70], [10, 30, 110, 70], [130, 20, 100, 80], [200, 80, 110, 70], [240, 0, 100, 70]];
  blobs.forEach((b, i) => { g += `<rect x="${b[0]}" y="${b[1]}" width="${b[2]}" height="${b[3]}" fill="${REGIONS[i].color}" opacity="${ctx.level >= REGIONS[i].levelReq ? .55 : .15}"/>`; });
  // 路徑
  g += `<polyline points="${nodes.map(n => n.join(',')).join(' ')}" fill="none" stroke="#f4f4f4" stroke-width="3" stroke-dasharray="6 5"/>`;
  nodes.forEach((n, i) => {
    const r = REGIONS[i], open = ctx.level >= r.levelReq, beat = !!game.bosses[r.id];
    g += `<rect x="${n[0] - 10}" y="${n[1] - 10}" width="20" height="20" fill="${beat ? '#ffcd75' : open ? r.color : '#333c57'}" stroke="#0d0e17" stroke-width="3"/>`;
    g += `<text x="${n[0]}" y="${n[1] + 24}" fill="${open ? '#f4f4f4' : '#566c86'}" font-size="10" text-anchor="middle" font-weight="700">${open ? r.name : '？？？'}</text>`;
    if (!open) g += `<text x="${n[0]}" y="${n[1] + 4}" fill="#94b0c2" font-size="10" text-anchor="middle">🔒</text>`;
    if (beat) g += `<text x="${n[0]}" y="${n[1] + 4}" fill="#0d0e17" font-size="11" text-anchor="middle">★</text>`;
  });
  const hn = nodes[curIdx];
  const heroMini = heroSVG(1).replace('<svg', `<svg x="${hn[0] - 8}" y="${hn[1] - 34}" width="16" height="15"`);
  g += heroMini;
  return `<svg viewBox="0 0 340 220" shape-rendering="crispEdges">${g}</svg>`;
}

/* ---------- 疼痛部位與相關動作 ----------
   依原始課表的 ⚠ 標記對應部位：⚠ 肩 → 肩膀、⚠ 腰 → 下背、⚠ 手腕 → 手腕與手麻。 */
const PAIN_AREAS = { shoulder: { label: '肩膀', match: '肩' }, back: { label: '下背', match: '腰' }, wrist: { label: '手腕', match: '手腕' } };
function exerciseAreas(def) { const w = def.warning || ''; return Object.keys(PAIN_AREAS).filter(k => w.includes(PAIN_AREAS[k].match)); }
/** 依開始前的狀況，回傳這個動作需要停止的原因（空陣列＝不受影響） */
function painStopReasons(pre, def) {
  if (!pre) return [];
  const areas = exerciseAreas(def), out = [];
  areas.forEach(k => { if (num(pre[k]) >= 4) out.push(`${PAIN_AREAS[k].label} ${pre[k]} 分`); });
  if (pre.numb === 'worse' && areas.includes('wrist')) out.push('手麻變明顯');
  return out;
}
/** 1–3 分：只需要留意的動作 */
function painWatchReasons(pre, def) {
  if (!pre) return [];
  return exerciseAreas(def).filter(k => num(pre[k]) > 0 && num(pre[k]) < 4).map(k => `${PAIN_AREAS[k].label} ${pre[k]} 分`);
}

function precheckAlertHTML() {
  const p = ui.pre, d = DAY[p.dayId];
  const stopList = d.exercises.map(def => ({ def, r: painStopReasons(p, def) })).filter(x => x.r.length);
  const watchList = d.exercises.map(def => ({ def, r: painWatchReasons(p, def) })).filter(x => x.r.length && !painStopReasons(p, def).length);
  let h = '';
  if (stopList.length) {
    h += `<div class="alert stop">⚠ 以下動作請停止，改做原始課表的替代動作；沒有替代動作就跳過：
      <ul class="rules">${stopList.map(x => `<li>${esc(x.def.name)}（${x.r.map(esc).join('、')}）${x.def.alternative ? `<br><span class="small">替代：${esc(x.def.alternative)}</span>` : '<br><span class="small">沒有替代動作 → 跳過</span>'}</li>`).join('')}</ul>
      不受影響的動作可以照常做。今天也可以選擇休息，不會影響任何紀錄。</div>`;
  } else if (Math.max(p.shoulder, p.back, p.wrist) >= 4 || p.numb === 'worse') {
    h += `<div class="alert mid">有 4 分以上的疼痛或手麻變明顯，但今天的動作沒有對應部位的 ⚠ 標記。訓練中只要引起疼痛，就用「回報疼痛」停下。</div>`;
  }
  if (watchList.length) h += `<div class="alert mid">3 分以下可以繼續，以下動作請特別留意：${watchList.map(x => esc(x.def.name)).join('、')}。升到 4 分以上或手麻變明顯就停下。</div>`;
  if (!h) h = `<div class="alert ok">狀況良好，記得手腕保持直的、握帶子輕輕握就好。</div>`;
  return h;
}

function updateExerciseStatus(e) {
  if (e.status === 'skipped') return;
  const target = e.sets.filter(isTargetSet);

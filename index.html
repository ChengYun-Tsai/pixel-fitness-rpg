}

async function finishSession() {
  const s = training.active;
  const sm = summarize(s);
  if (sm.setCount === 0 && !s.exercises.some(isParticipated)) {
    const discard = await confirmDialog({ title: '沒有任何紀錄', body: '<p>這次訓練還沒有完成任何一組。要捨棄這次訓練嗎？</p>', okText: '捨棄', cancelText: '繼續訓練', danger: true });
    if (discard) { training.active = null; saveTraining(); stopTimer(); releaseWakeLock(); ui.inSession = false; ui.tab = 'home'; render(); toast('已捨棄'); }
    return;
  }
  const o = sm.outcomes;
  const ok = await confirmDialog({
    title: '結束訓練？',
    body: `<p>已完成 ${sm.setCount} 組。完整完成 ${o.full} 個、疼痛安全跳過 ${o.safe} 個。</p>
      ${o.partial ? `<p class="yellow">有 <b>${o.partial}</b> 個動作只完成部分組數。</p>` : ''}
      ${o.none ? `<p>還有 <b>${o.none}</b> 個動作沒有做。</p>` : ''}
      ${sm.full ? '<p class="lime">✓ 符合完整課表！</p>' : '<p class="small muted">這次不符合「完整課表」，不會拿到完整課表獎勵，但已完成的部分照樣有獎勵，也沒有懲罰。</p>'}`,
    okText: '結束並結算', cancelText: '繼續訓練'
  });
  if (!ok) return;

  const lvBefore = levelInfo(game.exp).level;
  const itemsBefore = new Set(unlockedItemIds());
  s.endedAt = Date.now();
  if (s.pausedAt) { s.pausedMs += s.endedAt - s.pausedAt; s.pausedAt = null; }
  s.status = 'completed';
  s.summary = summarize(s);   // 快取（畫面一律即時重算，不依賴這份）
  training.sessions.push(s);
  training.active = null;
  saveTraining();

  const reward = awardSession(s);
  const newAch = checkAchievements();
  saveGame();
  const lvAfter = levelInfo(game.exp).level;
  const newItems = unlockedItemIds().filter(id => !itemsBefore.has(id));
  const prs = computePRs().filter(p => p.sessionId === s.id);

  stopTimer(); releaseWakeLock();
  ui.inSession = false; ui.tab = 'home'; ui.open = {}; ui.focus = {}; ui.info = {};
  render();
  if (lvAfter > lvBefore) beep(4, 1200);
  openModal('QUEST CLEAR!', resultHTML(s, reward, lvBefore, lvAfter, newAch, newItems, prs));
}

}

const BACKUP_APP = 'pixel-fitness-rpg';
const BACKUP_VERSION = 3;          // 3：新版課表（匯入時一律以新版課表的動作檢查）
const isObj = v => v !== null && typeof v === 'object' && !Array.isArray(v);
const isStr = v => typeof v === 'string';
const isNum = v => typeof v === 'number' && Number.isFinite(v);
const isDate = v => isStr(v) && /^\d{4}-\d{2}-\d{2}$/.test(v);
const optType = (v, fn) => v === undefined || v === null || fn(v);

/** 檢查一筆訓練紀錄；回傳錯誤訊息陣列 */
function validateSession(sess, where, expectStatus) {
  const err = [];
  if (!isObj(sess)) return [`${where}：不是物件`];
  if (!isStr(sess.id) || !sess.id) err.push(`${where}：缺少 id`);
  if (!DAY[sess.dayId]) err.push(`${where}：未知的訓練日 ${String(sess.dayId)}`);
  if (sess.kind !== 'formal') err.push(`${where}：kind 必須是 formal（新版課表沒有恢復日）`);
  if (!isDate(sess.date)) err.push(`${where}：日期格式錯誤`);
  if (!isNum(sess.startedAt)) err.push(`${where}：缺少開始時間`);
  if (expectStatus && sess.status !== expectStatus) err.push(`${where}：狀態應為 ${expectStatus}`);
  if (!expectStatus && !isStr(sess.status)) err.push(`${where}：缺少狀態`);
  if (!optType(sess.endedAt, isNum) || !optType(sess.pausedMs, isNum) || !optType(sess.pausedAt, isNum)) err.push(`${where}：時間欄位型態錯誤`);
  if (!optType(sess.gear, g => isObj(g))) err.push(`${where}：gear 必須是物件`);
  if (!Array.isArray(sess.exercises)) { err.push(`${where}：exercises 不是陣列`); return err; }
  sess.exercises.forEach((e, i) => {
    const w = `${where} 動作 ${i + 1}`;
    if (!isObj(e)) { err.push(`${w}：不是物件`); return; }
    if (!EX[e.exerciseId]) err.push(`${w}：未知的動作 ${String(e.exerciseId)}`);
    if (!isStr(e.status)) err.push(`${w}：缺少狀態`);
    if (!optType(e.painReports, Array.isArray)) err.push(`${w}：painReports 不是陣列`);
    if (!optType(e.reduced, v => isObj(v) && isNum(v.count) && v.count >= 1)) err.push(`${w}：reduced 格式錯誤`);
    if (!Array.isArray(e.sets)) { err.push(`${w}：sets 不是陣列`); return; }
    e.sets.forEach((x, k) => {
      if (!isObj(x)) err.push(`${w} 第 ${k + 1} 組：不是物件`);
      else if (typeof x.done !== 'boolean') err.push(`${w} 第 ${k + 1} 組：done 必須是 true/false`);
      else if (!optType(x.dropped, v => typeof v === 'boolean')) err.push(`${w} 第 ${k + 1} 組：dropped 必須是 true/false`);
      else if (x.dropped && x.done) err.push(`${w} 第 ${k + 1} 組：減量的組不能同時標為完成`);
    });
  });
  return err;
}
/** 完整檢查備份檔；只要有錯就回傳錯誤，不會動到目前資料 */
function validateBackup(data) {
  const err = [];
  if (!isObj(data)) return ['檔案內容不是物件'];
  if (data.app !== BACKUP_APP) err.push(`app 名稱不符（應為 ${BACKUP_APP}）`);
  if (!isNum(data.version) || data.version < 1 || data.version > BACKUP_VERSION) err.push(`版本 ${String(data.version)} 不支援（支援 1–${BACKUP_VERSION}）`);
  if (!isObj(data.training)) err.push('缺少 training');
  else {
    if (!Array.isArray(data.training.sessions)) err.push('training.sessions 不是陣列');
    else {
      const ids = new Set();
      data.training.sessions.forEach((sess, i) => {
        err.push(...validateSession(sess, `紀錄 ${i + 1}`, 'completed'));
        if (isObj(sess) && ids.has(sess.id)) err.push(`紀錄 ${i + 1}：id 重複`);
        if (isObj(sess)) ids.add(sess.id);
      });
    }
    if (data.training.active !== null && data.training.active !== undefined) err.push(...validateSession(data.training.active, '未完成的訓練', 'active'));
  }
  if (!isObj(data.game)) err.push('缺少 game');
  else {
    const g = data.game;
    if (!isNum(g.exp) || g.exp < 0) err.push('game.exp 必須是 0 以上的數字');
    if (!isNum(g.gold)) err.push('game.gold 必須是數字');
    ['awarded', 'dayFlags', 'weekGoals', 'checkAwarded', 'achievements', 'bosses', 'equipped'].forEach(k => { if (!optType(g[k], isObj)) err.push(`game.${k} 必須是物件`); });
    if (!optType(g.inventory, Array.isArray)) err.push('game.inventory 必須是陣列');
    if (!optType(g.name, isStr)) err.push('game.name 必須是文字');
  }
  if (!isObj(data.settings)) err.push('缺少 settings');
  else {
    ['sound', 'vibrate'].forEach(k => { if (!optType(data.settings[k], v => typeof v === 'boolean')) err.push(`settings.${k} 必須是 true/false`); });
    if (!optType(data.settings.gear, g => isObj(g) && ['bandLb', 'bottleKg'].every(k => isNum(g[k]) && g[k] > 0))) err.push('settings.gear 的器材重量必須是大於 0 的數字');
  }
  return err;
}
function importJSONFile(file) {
  const reader = new FileReader();
  reader.onload = async () => {
    let data;
    try { data = JSON.parse(reader.result); } catch (e) {
      openModal('無法匯入', '<div class="alert stop">檔案不是有效的 JSON。目前的資料沒有任何變動。</div>'); return;
    }
    const errors = validateBackup(data);
    if (errors.length) {
      openModal('無法匯入', `<div class="alert stop">備份檔格式錯誤，已拒絕匯入。目前的資料沒有任何變動。</div>
        <ul class="rules small">${errors.slice(0, 12).map(t => `<li>${esc(t)}</li>`).join('')}</ul>${errors.length > 12 ? `<p class="tiny muted">…還有 ${errors.length - 12} 個錯誤</p>` : ''}`);
      return;
    }
    const ok = await confirmDialog({
      title: '匯入備份',
      body: `<p>備份時間：${esc(data.exportedAt || '未知')}<br>訓練紀錄：${data.training.sessions.length} 筆${data.training.active ? '（含 1 筆未完成）' : ''}</p>
        <p class="red">匯入會<b>取代</b>目前所有資料（訓練紀錄、遊戲進度、設定）。</p>
        <div class="alert mid">建議先匯出目前的備份：<button class="btn sm" data-act="exportJSON">⬇ 先匯出目前備份</button></div>`,
      okText: '取代並匯入', danger: true
    });
    if (!ok) return;
    // 先保留目前的原始資料；任何一步寫入失敗就還原
    const backupRaw = Object.values(KEYS).map(k => [k, localStorage.getItem(k)]);
    try {
      const t = Object.assign(defaultTraining(), JSON.parse(JSON.stringify(data.training)));
      t.sessions.forEach(normalizeSession); if (t.active) normalizeSession(t.active);
      const g = Object.assign(defaultGame(), JSON.parse(JSON.stringify(data.game)));
      g.equipped = Object.assign(defaultGame().equipped, g.equipped || {});
      const st = Object.assign(defaultSettings(), data.settings);
      localStorage.setItem(KEYS.training, JSON.stringify(t));
      localStorage.setItem(KEYS.game, JSON.stringify(g));
      localStorage.setItem(KEYS.settings, JSON.stringify(st));
    } catch (e) {
      backupRaw.forEach(([k, v]) => { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e2) { } });
      openModal('無法匯入', '<div class="alert stop">寫入時發生錯誤，已還原成匯入前的資料。</div>');
      return;
    }
    toast('匯入完成，重新載入中…');
    setTimeout(() => location.reload(), 400);   // 重新載入畫面與資料
  };
  reader.readAsText(file);
}

/** 依照按鈕的 data-act 執行對應動作 */
const ACTIONS = {

  toggleInfo(el) { const k = el.dataset.k; ui.info[k] = !ui.info[k]; render(); },
  closeModal() { closeModal(); },
  modalBack(el, ev) { if (ev.target === el) closeModal(); },

  openVideos() { ui.tab = 'workout'; ui.workoutSub = 'videos'; ui.inSession = false; render(); window.scrollTo(0, 0); },
  async startDay(el) {
    const dayId = el.dataset.day;
    if (!DAY[dayId]) return;
    if (training.active) {
      const goResume = await confirmDialog({ title: '還有未完成的訓練', body: `<p>${esc(DAY[training.active.dayId].title)}（${fmtDate(training.active.date)}）還沒結束。</p><p class="small muted">要繼續那次訓練，還是先到那次訓練結算／捨棄後再開始新的？</p>`, okText: '繼續未完成的訓練', cancelText: '取消' });
      if (goResume) ACTIONS.resumeSession();
      return;
    }
    ui.pre = { dayId, shoulder: 0, back: 0, wrist: 0, numb: 'none' };
    openModal('身體狀況確認', precheckHTML());
  },
  confirmStart() {
    const p = ui.pre;
    training.active = createSession(p.dayId, { shoulder: p.shoulder, back: p.back, wrist: p.wrist, numb: p.numb });
    saveTraining(); closeModal();
    ui.tab = 'workout'; ui.inSession = true; ui.open = {}; ui.focus = {}; ui.info = {};
    requestWakeLock(); render(); window.scrollTo(0, 0);
  },
  resumeSession() {
    ui.tab = 'workout'; ui.inSession = true; requestWakeLock(); render(); window.scrollTo(0, 0);
  },
  pauseSession() {
    const s = training.active; if (!s || s.pausedAt) return;
    s.pausedAt = Date.now();
    if (timer.on && timer.pausedLeft === null) timer.pausedLeft = timerLeftMs();
    saveTraining(); render(); renderTimer();
  },
  resumeTimerSession() {
    const s = training.active; if (!s) return;
    if (s.pausedAt) { s.pausedMs += Date.now() - s.pausedAt; s.pausedAt = null; }
    if (timer.on && timer.pausedLeft !== null) { timer.endAt = Date.now() + timer.pausedLeft; timer.pausedLeft = null; }
    saveTraining(); requestWakeLock(); render(); renderTimer();
  },
  leaveSession() {
    const s = training.active;
    if (s && !s.pausedAt) s.pausedAt = Date.now(); // 暫離時自動暫停計時
    saveTraining(); stopTimer(); releaseWakeLock();
    ui.inSession = false; ui.tab = 'home'; render(); window.scrollTo(0, 0);
    toast('💾 進度已保存，回來可以繼續');
  },
  finishSession() { finishSession(); },
  toggleWarmup(el) { training.active.warmupDone = el.checked; saveTraining(); },
  toggleCooldown(el) { training.active.cooldownDone = el.checked; saveTraining(); },
  toggleCard(el) {
    const i = +el.dataset.i, e = training.active.exercises[i];
    const cur = ui.open[i] !== undefined ? ui.open[i] : e.status === 'pending';
    ui.open[i] = !cur; render();
  },
  focusSet(el) { ui.focus[+el.dataset.i] = +el.dataset.s; render(); },

  completeSet(el) {
    const i = +el.dataset.i, si = +el.dataset.s;
    const s = training.active, e = s.exercises[i], x = e.sets[si];
    const def = variantDef(EX[e.exerciseId], x.done ? x.alt : e.altIndex);
    if (def.perSide && def.type !== 'hiit') {
      const [kl, kr, kb] = sideKeys(def);
      if (num(x[kl]) === null || num(x[kr]) === null) { toast(`請輸入左右兩側的實際${def.type === 'time' ? '秒數' : '次數'}（相同可按「＝ 左右相同」）`); return; }
      x[kb] = String(Math.min(num(x[kl]), num(x[kr])));   // 舊欄位存「兩側都做到的數」，讓歷史比較與舊版相容
    }
    if (def.type === 'reps' && num(x.reps) === null) { toast('請先輸入實際完成次數'); return; }
    if (def.type === 'time' && num(x.seconds) === null) { toast('請先輸入實際完成秒數'); return; }
    const wasDone = x.done;
    if (!wasDone) {
      x.alt = e.altIndex ?? null;   // 記下這一組實際做的版本
      const next = e.sets.find((y, k) => k > si && isOpenSet(y));
      if (next && next.weight === '' && next.band === '') { next.weight = x.weight; next.band = x.band; }
    }
    x.done = true; x.completedAt = x.completedAt || Date.now();
    updateExerciseStatus(e);
    delete ui.focus[i];
    saveTraining();
    if (!wasDone) {
      const moreSets = exerciseOutcome(e) !== 'full' && e.sets.some(isOpenSet);
      const moreEx = s.exercises.slice(i + 1).some(y => y.status === 'pending');
      if (def.type !== 'hiit' && def.restSeconds && (moreSets || moreEx)) {
        startTimer(def.restSeconds, moreSets ? `組間休息 · ${def.name}` : '休息後進入下一個動作');
      }
      if (!moreSets) { ui.open[i] = false; toast(`✓ ${def.name} 完成！`); }
      beep(1, 760);
    } else toast('已儲存修改');
    render();
    if (exerciseOutcome(e) === 'full' || !e.sets.some(isOpenSet)) {
      const next = document.getElementById('card' + (i + 1));
      if (next) next.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  },
  undoSet(el) {
    const i = +el.dataset.i, e = training.active.exercises[i];
    e.sets[+el.dataset.s].done = false; updateExerciseStatus(e); saveTraining(); render();
  },
  addSet(el) {
    const i = +el.dataset.i, e = training.active.exercises[i];
    e.sets.push(newSet(true)); ui.focus[i] = e.sets.length - 1; ui.open[i] = true; saveTraining(); render();
  },
  removeSet(el) {
    const i = +el.dataset.i, e = training.active.exercises[i];
    e.sets.splice(+el.dataset.s, 1); delete ui.focus[i]; saveTraining(); render();
  },
  painReport(el) { ui.pain = { idx: +el.dataset.i, score: 0, numb: false }; openModal('回報疼痛／不適', painHTML()); },
  submitPain(el) {
    const p = ui.pain, e = training.active.exercises[p.idx], def = EX[e.exerciseId];
    e.painReports.push({ score: p.score, numb: p.numb, at: Date.now() });
    const mode = el.dataset.mode;
    if (mode === 'swap') { e.altIndex = 0; ui.open[p.idx] = true; toast(def.alternatives.length > 1 ? `已換成「${def.alternatives[0].name}」，卡片上可以選其他替代動作` : `已換成「${def.alternatives[0].name}」`); }
    if (mode === 'skip') { e.status = 'skipped'; e.skipReason = 'pain'; ui.open[p.idx] = false; stopTimer(); toast('已跳過。安全第一，不會扣 EXP'); }
    if (mode === 'continue') toast('已記錄，留意身體反應');
    saveTraining(); closeModal(); render();
  },
  reduceSet(el) {
    const i = +el.dataset.i, s = training.active, e = s.exercises[i];
    if (!s.worseNote || !canReduce(e)) return;
    // 拿掉最後一個還沒做的規定組（已完成的組與安全跳過紀錄都不動）
    const target = e.sets.map((x, k) => k).filter(k => isTargetSet(e.sets[k]) && !e.sets[k].done);
    const k = target[target.length - 1];
    e.sets[k].dropped = true;
    e.reduced = { count: 1, reason: 'nextDayWorse', at: Date.now() };
    delete ui.focus[i]; updateExerciseStatus(e); saveTraining(); render();
    toast(`這次少做一組：目標改為 ${e.sets.filter(isTargetSet).length} 組`);
  },
  restoreSet(el) {
    const i = +el.dataset.i, e = training.active.exercises[i];
    e.sets.forEach(x => { delete x.dropped; });
    delete e.reduced;
    updateExerciseStatus(e); saveTraining(); render();
    toast('已恢復課表原本的組數');
  },
  sameSides(el) {
    const i = +el.dataset.i, e = training.active.exercises[i], x = e.sets[+el.dataset.s];
    const def = variantDef(EX[e.exerciseId], e.altIndex);
    const [kl, kr] = sideKeys(def);
    const v = num(x[kl]) !== null ? x[kl] : x[kr];
    if (num(v) === null) { toast('請先填其中一側'); return; }
    x[kl] = x[kr] = String(v); saveTraining(); render();
  },
  openGear() { openModal('器材設定', gearFormHTML('modal')); },
  gearDefault() {
    const b = document.getElementById('gearBand'), w = document.getElementById('gearBottle');
    if (b) b.value = GEAR_DEFAULT.bandLb; if (w) w.value = GEAR_DEFAULT.bottleKg;
  },
  saveGear(el) {
    const band = num(document.getElementById('gearBand').value), bottle = num(document.getElementById('gearBottle').value);
    const err = document.getElementById('gearErr');
    const bad = [];
    if (band === null || band < GEAR_LIMIT.bandLb[0] || band > GEAR_LIMIT.bandLb[1]) bad.push(`阻力帶請輸入 ${GEAR_LIMIT.bandLb[0]}–${GEAR_LIMIT.bandLb[1]} lb`);
    if (bottle === null || bottle < GEAR_LIMIT.bottleKg[0] || bottle > GEAR_LIMIT.bottleKg[1]) bad.push(`水瓶請輸入 ${GEAR_LIMIT.bottleKg[0]}–${GEAR_LIMIT.bottleKg[1]} kg`);
    if (bad.length) { err.textContent = bad.join('；') + '。沒有儲存。'; err.classList.remove('hidden'); return; }
    settings.gear = { bandLb: Math.round(band * 10) / 10, bottleKg: Math.round(bottle * 100) / 100 };
    saveSettings();
    if (el.dataset.from === 'settings') openModal('設定與備份', settingsHTML()); else closeModal();
    render();
    toast(`器材設定已儲存：阻力帶 ${GEAR.bandLb} lb、水瓶 ${GEAR.bottleKg} kg`);
  },
  quickFill(el) {
    const x = training.active.exercises[+el.dataset.i].sets[+el.dataset.s];
    if (el.dataset.k === 'bottle') { x.weight = String(GEAR.bottleKg); x.band = x.band || ''; }
    if (el.dataset.k === 'band') { x.band = GEAR.bandLabel; }
    saveTraining(); render();
  },
  painSwap(el) {
    const i = +el.dataset.i, e = training.active.exercises[i], def = EX[e.exerciseId];
    e.painReports.push({ score: null, numb: false, at: Date.now(), source: 'precheck' });
    e.altIndex = 0; ui.open[i] = true; saveTraining(); render();
    toast(`已換成「${def.alternatives[0].name}」`);
  },
  painSkip(el) {
    const i = +el.dataset.i, e = training.active.exercises[i];
    e.painReports.push({ score: null, numb: false, at: Date.now(), source: 'precheck' });
    e.status = 'skipped'; e.skipReason = 'pain'; ui.open[i] = false; saveTraining(); render();
    toast('已跳過。安全第一，照樣有 EXP');
  },
  pickVariant(el) {
    const i = +el.dataset.i, e = training.active.exercises[i], def = EX[e.exerciseId];
    e.altIndex = el.dataset.v === '' ? null : +el.dataset.v;
    delete ui.focus[i]; ui.open[i] = true;
    saveTraining(); render();
    toast(e.altIndex === null ? `已換回原動作：${def.name}` : `已換成替代動作：${def.alternatives[e.altIndex].name}`);
  },
  skipEx(el) {
    const i = +el.dataset.i;
    openModal('跳過這個動作', `<p>跳過的原因：</p><div class="item-list">
      ${[['pain', '😣 疼痛／不適（不會扣 EXP，仍算安全完成）'], ['equip', '🧰 器材問題'], ['time', '⏰ 時間不夠'], ['other', '其他']].map(([k, l]) => `<button class="btn block ghost" data-act="doSkip" data-i="${i}" data-r="${k}">${l}</button>`).join('')}</div>
      <p class="tiny muted mt">跳過不會扣分。疼痛時請一律選第一項，安全比獎勵重要。</p>`);
  },
  doSkip(el) {
    const i = +el.dataset.i, e = training.active.exercises[i];
    e.status = 'skipped'; e.skipReason = el.dataset.r; ui.open[i] = false;
    saveTraining(); closeModal(); render();
  },
  unskip(el) { const e = training.active.exercises[+el.dataset.i]; e.status = 'pending'; e.skipReason = null; updateExerciseStatus(e); saveTraining(); render(); },

  startWork(el) {
    const i = +el.dataset.i, si = +el.dataset.s;
    const e = training.active.exercises[i], def = variantDef(EX[e.exerciseId], e.altIndex);   // 依目前選的動作計時（例如 3 分鐘、跪姿側棒式）
    startTimer(def.duration, `計時中 · ${def.name}${def.perSide ? '（單邊）' : ''}`, 'work', () => {
      const s = training.active; if (!s) return;
      const x = s.exercises[i] && s.exercises[i].sets[si];
      if (x && def.perSide) {
        const k = num(x.secondsL) === null ? 'secondsL' : num(x.secondsR) === null ? 'secondsR' : null;
        if (k) { x[k] = String(def.duration); saveTraining(); render(); }
        toast(k === 'secondsL' ? '左側時間到！換右側再計時一次' : '時間到！確認秒數後按「完成本組」');
        return;
      }
      if (x && num(x.seconds) === null) { x.seconds = String(def.duration); saveTraining(); render(); }
      toast('時間到！確認秒數後按「完成本組」');
    });
  },
  startHiit(el) {
    const i = +el.dataset.i, sess = training.active, def = EX[sess.exercises[i].exerciseId];
    const rounds = sess.exercises[i].sets.map((x, k) => k).filter(k => !sess.exercises[i].sets[k].done);
    if (!rounds.length) return;
    const phases = [];
    rounds.forEach(r => {
      def.hiitMoves.forEach((m, k) => {
        const nextMove = def.hiitMoves[k + 1] || (r !== rounds[rounds.length - 1] ? `第 ${r + 2} 輪：${def.hiitMoves[0]}` : null);
        phases.push({ sec: def.duration, label: `第 ${r + 1}/${def.sets} 輪 · 動！${m}`, mode: 'work' });
        phases.push({ sec: def.restSeconds, label: `第 ${r + 1}/${def.sets} 輪 · 休息：原地慢走${nextMove ? ' · 下一個：' + nextMove : ''}`, mode: 'rest',
          // 一輪的最後一段休息結束 → 這一輪自動打勾
          onEnd: k === def.hiitMoves.length - 1 ? () => {
            const s2 = training.active; if (!s2 || s2.id !== sess.id) return;
            const ex = s2.exercises[i], x = ex.sets[r];
            if (x && !x.done) { x.done = true; x.completedAt = Date.now(); x.alt = null; updateExerciseStatus(ex); saveTraining(); render(); }
          } : null });
      });
    });
    startPhases(phases, () => toast(`🔥 HIIT 完成 ${rounds.length} 輪！`));
    beep(2, 1040);
  },
  timerAdj(el) {
    const d = +el.dataset.v * 1000;
    if (timer.pausedLeft !== null) timer.pausedLeft = Math.max(0, timer.pausedLeft + d);
    else timer.endAt = Math.max(Date.now(), timer.endAt + d);
    timer.total = Math.max(timer.total, Math.ceil(timerLeftMs() / 1000));
    timer.cue = {};   // 依新的剩餘時間重新判斷倒數音
    renderTimer();
  },
  timerPause() {
    if (timer.pausedLeft !== null) { timer.endAt = Date.now() + timer.pausedLeft; timer.pausedLeft = null; }
    else timer.pausedLeft = timerLeftMs();
    renderTimer();
  },
  timerSkip() {
    if (timer.phases) { timerFinished(true); return; }   // 間歇計時：跳到下一段（最後一段也會觸發本輪打勾），跳過不播提示音
    const cb = timer.onDone; stopTimer();
    if (cb && timer.mode === 'work') cb();
  },

  nextDayCheck(el) {
    const s = training.sessions.find(x => x.id === el.dataset.id); if (!s) return;
    s.nextDay = { result: el.dataset.r, at: Date.now() };
    saveTraining();
    const r = awardNextDayCheck(s);
    const newAch = checkAchievements(); saveGame();
    toast(el.dataset.r === 'ok' ? `✓ 身體狀況 OK！+${r ? r.exp : 0} EXP` : '已記錄。依課表守則：下次少一組');
    newAch.forEach(a => toast(`🏆 成就解鎖：${a.name}`));
    if (training.active && el.dataset.r === 'worse') training.active.worseNote = true;
    if (el.dataset.from === 'pre') openModal('身體狀況確認', precheckHTML());
    render();
  },

  /* 角色 */
  openSlot(el) { openModal(`${SLOTS.find(s => s.id === el.dataset.slot).name}`, slotModalHTML(el.dataset.slot)); },
  equip(el) {
    const it = ITEM[el.dataset.id]; if (!it || !isItemUnlocked(it)) return;
    game.equipped[it.slot] = it.id; saveGame(); render();
    openModal(`${SLOTS.find(s => s.id === it.slot).name}`, slotModalHTML(it.slot));
  },
  async buyItem(el) {
    const it = ITEM[el.dataset.id];
    if (game.gold < it.unlock.price) { toast('金幣不足'); return; }
    const ok = await confirmDialog({ title: '購買裝備', body: `<p>用 ${it.unlock.price} G 購買「${esc(it.name)}」？</p>`, okText: '購買' });
    if (!ok) return;
    game.gold -= it.unlock.price; game.inventory.push(it.id); game.equipped[it.slot] = it.id;
    saveGame(); render(); toast(`🎁 獲得 ${it.name}！`);
  },
  renameHero() {
    openModal('角色名稱', `<label class="f">名稱<input type="text" id="heroName" maxlength="16" value="${esc(game.name)}"></label>
      <div class="btn-row mt"><button class="btn ghost" data-act="closeModal">取消</button><button class="btn green" data-act="saveName">儲存</button></div>`);
  },
  saveName() { const v = document.getElementById('heroName').value.trim(); game.name = v || '冒險者'; saveGame(); closeModal(); render(); },

  /* 地圖 */
  openDex() { openModal('怪物圖鑑', dexHTML()); },
  challengeBoss(el) {
    const r = REGION[el.dataset.id], ctx = buildContext();
    if (!bossReady(r, ctx) || game.bosses[r.id]) return;
    const m = MONSTERS[r.boss.m];
    openModal(`BOSS · ${esc(m.name)}`, `<p class="small">${esc(m.desc)}</p>
      <div class="battle"><div id="bHero">${heroSVG(5)}</div><div id="bBoss">${monsterSVG(r.boss.m, 6)}</div></div>
      <div class="row small mt"><span>HP</span><div class="bar hp grow"><i id="bHp" style="width:100%"></i></div></div>
      <p id="bLog" class="center mt">你累積的訓練成果化為力量……</p>
      <p class="tiny muted center">Boss 戰只看累積成果，不需要額外訓練。</p>`);
    const hits = [70, 40, 15, 0];
    hits.forEach((hp, k) => setTimeout(() => {
      const hero = document.getElementById('bHero'), boss = document.getElementById('bBoss'), bar = document.getElementById('bHp'), log = document.getElementById('bLog');
      if (!hero) return;
      hero.classList.remove('hop'); boss.classList.remove('shake'); void hero.offsetWidth;
      hero.classList.add('hop'); boss.classList.add('shake'); bar.style.width = hp + '%'; beep(1, 300 + k * 120);
      log.textContent = ['STR 攻擊！', 'VIT 堅守！', 'DEX 連擊！', `擊敗了 ${m.name}！`][k];
      if (hp === 0) {
        game.bosses[r.id] = Date.now(); game.gold += r.boss.gold;
        const before = new Set(unlockedItemIds());
        const newAch = checkAchievements(); saveGame();
        const items = ITEMS.filter(i => i.unlock.type === 'boss' && i.unlock.id === r.id).map(i => i.name);
        log.innerHTML = `<span class="levelup">VICTORY!</span><br>+${r.boss.gold} G${items.length ? `<br>🎁 獲得：${items.map(esc).join('、')}` : ''}${newAch.length ? `<br>🏆 ${newAch.map(a => esc(a.name)).join('、')}` : ''}`;
        beep(4, 1200); render();
      }
    }, 700 * (k + 1)));
  },

  /* 紀錄 */
  histDetail(el) {
    const s = training.sessions.find(x => x.id === el.dataset.id); if (!s) return;
    openModal('訓練紀錄', sessionDetailHTML(s) + `<div class="btn-row mt"><button class="btn" data-act="histEdit" data-id="${s.id}">✎ 修改</button><button class="btn red" data-act="histDelete" data-id="${s.id}">🗑 刪除</button></div>`);
  },
  histEdit(el) { const s = training.sessions.find(x => x.id === el.dataset.id); if (s) openModal('修改紀錄', editHTML(s)); },
  histSaveEdit(el) {
    const s = training.sessions.find(x => x.id === el.dataset.id); if (!s) return;
    const d = document.getElementById('edDate').value;
    if (/^\d{4}-\d{2}-\d{2}$/.test(d)) s.date = d;
    document.querySelectorAll('[data-ed]').forEach(inp => {
      const [ei, si, field] = inp.dataset.ed.split('_');
      const x = s.exercises[+ei].sets[+si];
      x[field] = field === 'done' ? inp.checked : inp.value.trim();
    });
    // 單邊動作：依左右重新計算「兩側都做到的數」
    s.exercises.forEach(e => {
      const base = EX[e.exerciseId]; if (!base) return;
      e.sets.forEach(x => {
        const def = variantDef(base, x.alt); if (!def.perSide || def.type === 'hiit') return;
        const [kl, kr, kb] = sideKeys(def);
        if (num(x[kl]) !== null && num(x[kr]) !== null) x[kb] = String(Math.min(num(x[kl]), num(x[kr])));
      });
    });
    s.exercises.forEach(updateExerciseStatus);
    s.summary = summarize(s);
    saveTraining(); closeModal(); render(); toast('紀錄已更新');
  },
  async histDelete(el) {
    const s = training.sessions.find(x => x.id === el.dataset.id); if (!s) return;
    const ok = await confirmDialog({ title: '刪除這筆紀錄？', body: `<p>${fmtDate(s.date)}｜${esc(DAY[s.dayId].title)}</p><p class="red">刪除後無法復原。</p><p class="tiny muted">已發放的遊戲獎勵不會被收回。</p>`, okText: '確定刪除', danger: true });
    if (!ok) return;
    training.sessions = training.sessions.filter(x => x.id !== s.id);
    saveTraining(); render(); toast('已刪除');
  },

  /* 設定 */
  openSettings() { openModal('設定與備份', settingsHTML()); },
  exportJSON() { exportJSON(); },
  exportCSV() { exportCSV(); },
  importJSON() { document.getElementById('importFile').click(); },
  async resetGame() {
    const ok = await confirmDialog({ title: '重置遊戲角色？', body: '<p>會清除等級、EXP、金幣、裝備、成就與 Boss 紀錄。</p><p class="lime"><b>真實訓練紀錄會完整保留。</b></p>', okText: '重置遊戲', danger: true });
    if (!ok) return;
    const name = game.name;
    game = defaultGame(); game.name = name;
    // 已存在的訓練紀錄標記為已處理，避免之後重複發放；需要時可用「依訓練紀錄重算」
    completedSessions().forEach(s => { game.awarded[s.id] = { exp: 0, gold: 0, reset: true }; if (s.nextDay) game.checkAwarded[s.id] = true; });
    saveGame(); render(); toast(`遊戲已重置，訓練紀錄 ${completedSessions().length} 筆完整保留`);
  },
  async rebuildGame() {
    const ok = await confirmDialog({ title: '依訓練紀錄重算？', body: '<p>會依照目前所有訓練紀錄，重新計算 EXP、金幣與成就。商店購買的裝備與 Boss 紀錄會清除（Boss 可以立即重新挑戰）。</p>', okText: '重算' });
    if (!ok) return;
    rebuildGameFromHistory(true); render(); toast(`已重算：Lv ${levelInfo(game.exp).level}`);
  },
  async clearHistory() {
    const ok = await confirmDialog({ title: '刪除全部訓練紀錄？', body: `<p class="red">將刪除 ${training.sessions.length} 筆訓練紀錄與未完成的訓練，無法復原。</p>`, okText: '我了解，刪除', danger: true, requireText: '刪除' });
    if (!ok) return;
    const ok2 = await confirmDialog({ title: '最後確認', body: '<p>真的要刪除全部訓練紀錄嗎？建議先匯出備份。</p>', okText: '刪除全部', danger: true });
    if (!ok2) return;
    training = defaultTraining(); saveTraining(); stopTimer();
    ui.inSession = false; render(); toast('已刪除全部訓練紀錄（遊戲進度保留）');
  }
};

/* 點擊事件（事件委派） */
document.addEventListener('click', ev => {
  unlockAudio();   // iOS Safari：在使用者手勢中建立／恢復 AudioContext
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const act = ACTIONS[el.dataset.act];
  if (!act) return;
  if (el.tagName === 'INPUT' && el.type === 'checkbox') { act(el, ev); return; }
  act(el, ev);
});

/* 輸入事件：訓練中每組欄位即時保存（不重繪，避免輸入中斷） */
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.dataset.field && training.active) {
    const x = training.active.exercises[+t.dataset.i].sets[+t.dataset.s];
    x[t.dataset.field] = t.value;
    saveTraining();
  } else if (t.dataset.pre && ui.pre) {
    ui.pre[t.dataset.pre] = t.dataset.pre === 'numb' ? t.value : +t.value;
    const pv = document.getElementById('pv_' + t.dataset.pre); if (pv) pv.textContent = t.value;
    document.getElementById('preAlert').innerHTML = precheckAlertHTML();
  } else if (t.dataset.painfield && ui.pain) {
    ui.pain[t.dataset.painfield] = t.type === 'checkbox' ? t.checked : +t.value;
    const pv = document.getElementById('painVal'); if (pv) pv.textContent = ui.pain.score;
    document.getElementById('painAlert').innerHTML = painAlertHTML();
  }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.change === 'statsMove') { ui.statsMove = t.value; render(); }
  else if (t.dataset.setting) { settings[t.dataset.setting] = t.checked; saveSettings(); }
  else if (t.dataset.pre && ui.pre) { ui.pre[t.dataset.pre] = t.dataset.pre === 'numb' ? t.value : +t.value; document.getElementById('preAlert').innerHTML = precheckAlertHTML(); }
  else if (t.dataset.painfield && ui.pain) { ui.pain[t.dataset.painfield] = t.type === 'checkbox' ? t.checked : +t.value; document.getElementById('painAlert').innerHTML = painAlertHTML(); }
});
document.getElementById('importFile').addEventListener('change', ev => {
  const f = ev.target.files[0]; if (f) importJSONFile(f); ev.target.value = '';
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    if (audioCtx && settings.sound && audioCtx.state !== 'running') audioCtx.resume().catch(() => {});   // 從背景回來時嘗試恢復音效
    if (training.active && ui.inSession && !training.active.pausedAt) requestWakeLock(); tick();
  }
  else if (training.active) saveTraining();
});
window.addEventListener('pagehide', () => { if (training.active) saveTraining(); });

/* =====================================================================
   啟動
   ===================================================================== */
/** 補齊缺少的欄位（不改動已有的數值） */
function normalizeSession(s) {
  if (!Array.isArray(s.exercises)) s.exercises = [];
  s.exercises.forEach(e => {
    if (!Array.isArray(e.sets)) e.sets = [];
    if (!Array.isArray(e.painReports)) e.painReports = [];
    if (e.altIndex === undefined) e.altIndex = null;
    e.sets.forEach(x => { if (x.alt === undefined) x.alt = null; ['repsL', 'repsR', 'secondsL', 'secondsR'].forEach(k => { if (x[k] === undefined) x[k] = ''; }); });
  });
}
/** 紀錄裡的訓練日與動作都存在於目前課表 */
function isKnownSession(s) {
  return !!s && !!DAY[s.dayId] && Array.isArray(s.exercises) && s.exercises.every(e => e && EX[e.exerciseId]);
}
(function init() {
  // 課表裡已經不存在的紀錄（例如舊版恢復日的測試資料）：移到 training.archived 保存，不顯示、不刪除
  const unknown = training.sessions.filter(x => !isKnownSession(x));
  if (training.active && !isKnownSession(training.active)) { unknown.push(training.active); training.active = null; }
  if (unknown.length) {
    training.archived = (Array.isArray(training.archived) ? training.archived : []).concat(unknown);
    training.sessions = training.sessions.filter(isKnownSession);
    saveJSON(KEYS.training, training);
  }
  // 已移除的裝備（恢復護符）：改回該欄位的初始裝備
  Object.keys(game.equipped).forEach(k => { if (!ITEM[game.equipped[k]]) game.equipped[k] = defaultGame().equipped[k]; });
  training.sessions.forEach(normalizeSession);
  if (training.active) normalizeSession(training.active);
  // 關掉網頁超過 10 分鐘才回來：從最後一次操作的時間自動暫停，避免訓練時間被灌水
  const s = training.active;
  if (s && !s.pausedAt && s.lastTouch && Date.now() - s.lastTouch > 10 * 60 * 1000) {
    s.pausedAt = s.lastTouch; saveJSON(KEYS.training, training);
  }
  checkAchievements(); saveGame();
  render();
  setInterval(tick, 250);
})();
</script>
